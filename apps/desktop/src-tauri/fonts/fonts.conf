<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- AppImage only: the system configuration (every system font, unchanged), plus the bundled
     Noto Sans TC from this directory. The app points FONTCONFIG_FILE here only when the system
     has no CJK font at all (src-tauri/src/lib.rs), so system fonts always keep priority. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
</fontconfig>
