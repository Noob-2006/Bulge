[package]
name = "seagent-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true                                     # platform: process groups, PDEATHSIG, termios, statvfs, getrandom

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp"] } # platform: Job Objects, named pipes, DACLs, console, ConPTY; ToolHelp: parent pid (already enabled by seagent-kernel)
