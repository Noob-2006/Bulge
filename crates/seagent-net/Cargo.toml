[package]
name = "seagent-net"
version.workspace = true
edition.workspace = true
license.workspace = true

# Shared network plumbing for channels, MCP OAuth and the app server.
# Every dependency here was already in the tree through ureq; none adds a crate.
[dependencies]
rustls.workspace = true
webpki-roots.workspace = true
ring.workspace = true
base64.workspace = true
# The shared outbound HTTP client builder (`http`): proxy / NO_PROXY / CA / offline for every
# ureq agent in the workspace (ent-036/037/039). Already in the tree; adds no crate.
ureq.workspace = true
serde.workspace = true

# mDNS (`mdns/`): setsockopt before bind (SO_REUSEADDR / SO_REUSEPORT, IPV6_V6ONLY) so the
# responder shares UDP 5353 with the system's own (Avahi, mDNSResponder, the Windows DNS
# client), IP(V6)_MULTICAST_IF / IPV6_MULTICAST_HOPS per send, and the interface list
# (getifaddrs / GetAdaptersAddresses; IpHelper + Ndis are already enabled by the seagent
# binary). Both crates are already in the tree (seagent-core); no new crate.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
