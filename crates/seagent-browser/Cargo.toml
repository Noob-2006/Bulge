[package]
name = "seagent-browser"
version.workspace = true
edition.workspace = true
license.workspace = true

# Built-in browser: a Chrome DevTools Protocol client, managed Chromium profiles, cloud /
# Camofox / Lightpanda / sandbox backends and the model-facing browser tools.
# No new crates: WebSocket and TLS come from seagent-net, HTTP from ureq.
[features]
# Personal-desktop browser bridges (gen1-306): the Chrome-extension relay and importing
# the user's real Chrome profile. Off by default; `seagent --features personal` turns it on.
personal = []
# Exposes `cdp::fake` (a scriptable DevTools stub) to integration tests of dependent crates.
test-util = []

[dependencies]
seagent-core.workspace = true
seagent-net.workspace = true
seagent-security.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
regex.workspace = true
ring.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The vault's masked console prompt (CONIN$ echo off); the isolated Bot Desktop
# (control/screen_windows.rs): a separate window-station desktop the headed browser is launched
# into, screenshots of it, and switching to it for a human takeover.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    # The virtual display (control/vdd.rs): the driver's class key, and the elevated installer.
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }
# Windows.Graphics.Capture for GPU windows of the Bot Desktop's live view (control/wgc.rs) and
# DXGI Desktop Duplication of the virtual monitor (control/dxgi_dup.rs).
windows.workspace = true
