[package]
name = "bulge-vm"
description = "libkrun microVM supervision: egress-filtered networking, workspace overlay, guest channel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bulge-proto = { path = "../bulge-proto" }
command-fds = { version = "0.3", features = ["tokio"] }
getrandom.workspace = true
if-addrs = "0.15"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "net", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
