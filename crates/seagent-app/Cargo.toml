[package]
name = "seagent-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# The app server: one protocol (ARP, JSON-RPC 2.0) for every UI — web, desktop,
# terminal, editors (ACP), devices (nodes) and other agents (A2A).
[features]
default = ["channel", "providers"]
# Chat channels: every platform (additive; `--no-default-features` keeps seagent-channel's
# always-compiled core only — see docs/BUILD.md).
channel = ["seagent-channel/all"]
# Model adapters (Bedrock, Vertex/Gemini, agent CLIs, Agents API, managed llama.cpp):
# additive; `--no-default-features` leaves only the core OpenAI/Anthropic/Responses formats.
providers = ["seagent-kernel/providers"]

[dependencies]
seagent-core.workspace = true
seagent-security.workspace = true
seagent-kernel = { path = "../seagent-kernel", default-features = false }
seagent-net.workspace = true
seagent-plugin.workspace = true
seagent-tools.workspace = true
seagent-browser.workspace = true
seagent-vm.workspace = true # desktop VMs: view.desktop.* targets, view.vm.*, computer_use on a VM
# Features are chosen by this crate's `channel` feature (cargo cannot override
# `default-features` through `workspace = true`).
seagent-channel = { path = "../seagent-channel", default-features = false }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
ring.workspace = true
ureq.workspace = true
# Decode petdex WebP spritesheets (already in the tree through seagent-media).
# SAML (ent-048): a strict, pull-based XML tokenizer; seagent builds its own tree for exclusive C14N.
quick-xml = { version = "0.42", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Node host on Windows (docs/cross-platform.md): SendInput / cursor for computer.act, the
# battery read-out of the TUI status bar.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Power"] }
