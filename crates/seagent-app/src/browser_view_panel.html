<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seagent live view</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: #111; color: #e6e6e6; }
  h1 { font-size: 16px; margin: 0 0 12px; font-weight: 600; } h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; color: #9fd; }
  main { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
  section { border: 1px solid #333; border-radius: 8px; padding: 12px; min-width: 0; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  button { background: #234; color: #e6e6e6; border: 1px solid #456; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: #345; } button:disabled { opacity: .5; cursor: default; }
  input { background: #1b1b1b; color: #e6e6e6; border: 1px solid #444; border-radius: 6px; padding: 4px 8px; min-width: 0; }
  #url, #text { flex: 1 1 180px; }
  #browsers { display: flex; flex-direction: column; gap: 6px; max-height: 170px; overflow: auto; }
  .browser { border: 1px solid #2c2c2c; border-radius: 6px; padding: 6px 8px; }
  .key { font-weight: 600; color: #ffd479; } .meta { color: #888; font-size: 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tab { border: 1px solid #444; border-radius: 999px; padding: 2px 10px; cursor: pointer; font-size: 12px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab.on { background: #2b6; border-color: #2b6; color: #041; }
  .frame { width: 100%; background: #000; border: 1px solid #333; border-radius: 6px; object-fit: contain; min-height: 160px; max-height: 70vh; outline: none; }
  #bframe:focus { border-color: #2b6; }
  .err { color: #ff8a8a; white-space: pre-wrap; margin: 6px 0 0; } .msg { color: #ffcf6b; }
  #lease { margin: 0 0 4px; font-size: 12px; color: #bbb; word-break: break-word; }
</style>
</head>
<body>
<h1>seagent live view</h1>
<p id="notice" class="msg" hidden>Sign in to the console on this browser first (or open /view/?token=&lt;token&gt; once).</p>
<main>
  <section>
    <h2>Browser</h2>
    <div id="browsers" class="meta">loading…</div>
    <div class="bar">
      <button id="back">◀ back</button><button id="fwd">forward ▶</button><button id="reload">⟳ reload</button>
      <input id="url" placeholder="address to open" autocomplete="off" spellcheck="false"><button id="go">go</button>
      <button id="novnc" title="open the sandbox browser in noVNC">noVNC</button>
    </div>
    <img id="bframe" class="frame" alt="browser frame" tabindex="0">
    <div class="bar">
      <input id="text" placeholder="text to type into the page" autocomplete="off"><button id="send">type</button>
      <span class="meta">click / double-click / wheel / arrows / Tab / Enter act on the frame</span>
    </div>
    <p id="berr" class="err" hidden></p>
  </section>
  <section>
    <h2>Desktop</h2>
    <p id="lease">loading…</p>
    <div class="bar">
      <button id="take">take control</button><button id="hand">hand back</button><span class="meta" id="viewer"></span>
    </div>
    <img id="dframe" class="frame" alt="desktop frame">
    <p id="derr" class="err" hidden></p>
  </section>
</main>
<script nonce="{{NONCE}}" src="/ui/devauth.js"></script>
<script nonce="{{NONCE}}">
(function () {
  "use strict";
  // ── credentials: renewed silently, forever, and never left in the URL ──
  // A token in the URL (?token= / #token=) is read once, kept in sessionStorage and removed from
  // the address bar; without one the page uses the console's own session on this browser.
  // Device access tokens are short-lived: a key-bound console token (sed1_) is exchanged for an
  // access token at POST /pair/refresh with a fresh device-key signature, renewed at ~80 % of its
  // life and retried with backoff (2 s … 60 s) forever. devauth.js does exactly this when the
  // host serves it (window.DevAuth); the fallback below follows the same contract and the same
  // key store, so both share one device key.
  var params = new URLSearchParams(location.search), hashp = new URLSearchParams(location.hash.slice(1));
  var session = params.get("session") || "";
  var TK = "seagent.view.token";
  var ss = function (k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } };
  var ls = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var given = params.get("token") || hashp.get("token");
  if (given) {
    ss(TK, given);
    params.delete("token");
    var qs = params.toString();
    history.replaceState(null, "", location.pathname + (qs ? "?" + qs : ""));
  }
  var base = given || ss(TK) || ls("seagent.token") || "", deviceId = ls("seagent.deviceId") || "";
  var notice = document.getElementById("notice");
  if (!base) { notice.hidden = false; return; }
  var auth = { cur: base, exp: 0, timer: null, renewals: 0 };
  window.SeagentViewAuth = auth; // diagnostics / tests
  var b64url = function (buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  function keyPair() {
    if (!window.isSecureContext || !window.crypto || !crypto.subtle || !window.indexedDB) return Promise.resolve(null);
    return new Promise(function (ok) {
      var open = indexedDB.open("seagent-devkey", 1);
      open.onupgradeneeded = function () { open.result.createObjectStore("keys"); };
      open.onerror = function () { ok(null); };
      open.onsuccess = function () {
        var db = open.result, get = db.transaction("keys", "readonly").objectStore("keys").get("device");
        get.onsuccess = function () {
          if (get.result) return ok(get.result);
          crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]).then(function (kp) {
            var put = db.transaction("keys", "readwrite").objectStore("keys").put(kp, "device");
            put.onsuccess = function () { ok(kp); };
            put.onerror = function () { ok(null); };
          }, function () { ok(null); });
        };
        get.onerror = function () { ok(null); };
      };
    });
  }
  // One exchange of the console token for an access token; resolves false when this host or
  // browser cannot do it (older host, no WebCrypto, not key-bound), rejects on a transient error.
  function refreshNow() {
    if (window.DevAuth) {
      return window.DevAuth.access(base, deviceId).then(function (t) { auth.cur = window.DevAuth.current() || t || base; return auth.cur !== base; });
    }
    if (!/^sed1_/.test(base) || !deviceId) return Promise.resolve(false);
    return keyPair().then(function (kp) {
      if (!kp) return false;
      var t0 = Date.now();
      return fetch("/pair/info", { cache: "no-store" }).then(function (r) {
        if (r.status >= 500) throw new Error("HTTP " + r.status);
        return r.ok ? r.json() : null;
      }).then(function (info) {
        if (!info || !info.hostId) return false;
        var ts = Date.now() + ((info.nowMs || t0) - Math.round((t0 + Date.now()) / 2)), nb = new Uint8Array(18);
        crypto.getRandomValues(nb);
        var nonce = b64url(nb), msg = "seagent-device-refresh|v1|" + info.hostId + "|" + deviceId + "|" + ts + "|" + nonce;
        return Promise.all([crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, kp.privateKey, new TextEncoder().encode(msg)), crypto.subtle.exportKey("raw", kp.publicKey)]).then(function (x) {
          var body = { deviceId: deviceId, ts: ts, nonce: nonce, sig: b64url(x[0]), publicKey: b64url(x[1]), keyStore: "webcrypto" };
          return fetch("/pair/refresh", { method: "POST", cache: "no-store", headers: { "content-type": "application/json", "authorization": "Bearer " + base }, body: JSON.stringify(body) });
        }).then(function (r) {
          if (r.status === 404) return false;
          return r.json().catch(function () { return {}; }).then(function (v) {
            if (r.ok && v.accessToken) { auth.cur = v.accessToken; auth.exp = v.expiresAtMs || 0; return true; }
            if (r.status >= 500 || r.status === 429 || /before this host started|replay window/.test(v.error || "")) throw new Error(v.error || "HTTP " + r.status);
            return false;
          });
        });
      });
    });
  }
  // Renew at ~80 % of the access token's life; after a failure retry in 2, 4 … 60 s, forever.
  function schedule(retryMs) {
    clearTimeout(auth.timer);
    var wait = retryMs;
    if (wait === undefined) {
      var exp = window.DevAuth ? 0 : auth.exp;
      if (!exp) return; // devauth.js keeps its own timer; plain tokens need none
      wait = Math.max(500, Math.round((exp - Date.now()) * 0.8));
    }
    auth.timer = setTimeout(function () {
      refreshNow().then(function (ok) { if (ok) auth.renewals++; schedule(ok ? undefined : Math.min(60000, Math.max(2000, (retryMs || 1000) * 2))); },
        function () { schedule(Math.min(60000, Math.max(2000, (retryMs || 1000) * 2))); });
    }, wait);
  }
  function token() { return (window.DevAuth && window.DevAuth.current()) || auth.cur; }
  var ready = (/^se[ad]1_/.test(base) ? refreshNow().catch(function () { schedule(2000); return false; }) : Promise.resolve(false)).then(function (ok) { if (ok) schedule(); });

  var $ = function (id) { return document.getElementById(id); };
  var bframe = $("bframe"), dframe = $("dframe"), urlEl = $("url"), textEl = $("text");
  var browsersEl = $("browsers"), leaseEl = $("lease"), viewerEl = $("viewer");
  function showErr(id, m) { var p = $(id); p.textContent = String(m); p.hidden = false; }
  function clearErr(id) { var p = $(id); p.hidden = true; p.textContent = ""; }

  // Viewer ids are client-chosen handles (8-128 of [A-Za-z0-9_-]), kept across reloads.
  function newViewer() {
    var a = new Uint8Array(16), s = "";
    crypto.getRandomValues(a);
    for (var i = 0; i < a.length; i++) s += (a[i] % 36).toString(36);
    return "viewer-" + s;
  }
  var VK = "seagent.viewer", viewer = "";
  try { viewer = localStorage.getItem(VK) || ""; } catch (e) { viewer = ""; }
  if (!/^[A-Za-z0-9_-]{8,128}$/.test(viewer)) {
    viewer = newViewer();
    try { localStorage.setItem(VK, viewer); } catch (e) { /* private mode */ }
  }
  viewerEl.textContent = "you are " + viewer.slice(0, 16) + "…";

  function api(path, opts, retried) {
    var o = opts || {}, h = { "authorization": "Bearer " + token() }, extra = o.headers || {}, k;
    for (k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) h[k] = extra[k];
    var init = { method: o.method || "GET", headers: h, cache: "no-store" };
    if (o.body !== undefined) init.body = o.body;
    return ready.then(function () { h.authorization = "Bearer " + token(); return fetch(path, init); }).then(function (r) {
      if (r.ok) return r;
      // An expired access token (laptop asleep, host restarted): renew once and retry.
      if (r.status === 401 && !retried) {
        if (window.DevAuth) window.DevAuth.forget();
        return refreshNow().catch(function () { return false; }).then(function (ok) {
          if (ok) { schedule(); return api(path, opts, true); }
          return Promise.reject(new Error("401: sign-in expired and could not be renewed"));
        });
      }
      return r.text().then(function (t) {
        var msg = r.status + " " + (r.statusText || "");
        try { var j = JSON.parse(t); if (j && j.error) msg = r.status + ": " + j.error; } catch (e) { if (t) msg = r.status + ": " + t.slice(0, 300); }
        throw new Error(msg);
      });
    });
  }
  function apiJson(path, opts) { return api(path, opts).then(function (r) { return r.json(); }); }
  function post(path, body) { return apiJson(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) }); }
  function withSession(q) { if (session) q.set("session", session); return q; }

  // ── browser list: every running browser and its tabs ──
  var sel = { key: "", targetId: "", novnc: false };
  function select(key, targetId, novnc) {
    sel.key = key; sel.targetId = targetId; sel.novnc = !!novnc;
    clearErr("berr"); tickFrame(); loadBrowsers();
  }
  function tabBtn(key, tab, novnc) {
    var b = document.createElement("button");
    b.className = "tab" + (sel.key === key && sel.targetId === tab.targetId ? " on" : "");
    b.textContent = (tab.label || tab.title || tab.url || tab.targetId) + (tab.session ? " •session" : "");
    b.title = tab.url || tab.targetId;
    b.addEventListener("click", function () { select(key, tab.targetId, novnc); });
    return b;
  }
  function renderBrowsers(j) {
    browsersEl.textContent = "";
    var arr = (j && j.browsers) || [];
    if (!arr.length) { browsersEl.className = "msg"; browsersEl.textContent = "no browser is running yet — the agent has not opened one."; return; }
    browsersEl.className = "";
    arr.forEach(function (br) {
      var box = document.createElement("div"), head = document.createElement("div"), key = document.createElement("span"), meta = document.createElement("span");
      box.className = "browser";
      key.className = "key"; key.textContent = br.key;
      meta.className = "meta";
      meta.textContent = " · " + (br.kind || "browser") + (br.headless ? " · headless" : "") + (br.novnc ? " · noVNC" : "") + (br.error ? " · " + br.error : "");
      head.appendChild(key); head.appendChild(meta); box.appendChild(head);
      var tabs = document.createElement("div");
      tabs.className = "tabs";
      (br.tabs || []).forEach(function (t) { tabs.appendChild(tabBtn(br.key, t, br.novnc)); });
      if (!(br.tabs || []).length) { var n = document.createElement("span"); n.className = "meta"; n.textContent = "no tabs"; tabs.appendChild(n); }
      box.appendChild(tabs); browsersEl.appendChild(box);
    });
    if (!sel.targetId) {
      for (var i = 0; i < arr.length; i++) {
        var t = (arr[i].tabs || [])[0];
        if (t) { select(arr[i].key, t.targetId, arr[i].novnc); break; }
      }
    }
  }
  function loadBrowsers() {
    return apiJson("/view/browser" + (session ? "?session=" + encodeURIComponent(session) : ""))
      .then(renderBrowsers).catch(function (e) { showErr("berr", e.message); });
  }

  // ── browser frame: ~500 ms JPEG into an object-fit:contain picture ──
  var frameUrl = "", frameBusy = false, frameMisses = 0;
  function tickFrame() {
    if (!sel.key || !sel.targetId || frameBusy) return;
    frameBusy = true;
    var q = withSession(new URLSearchParams({ key: sel.key, targetId: sel.targetId, maxWidth: "1024", quality: "60" }));
    api("/view/browser/frame?" + q.toString()).then(function (r) { return r.blob(); }).then(function (blob) {
      var u = URL.createObjectURL(blob);
      bframe.src = u;
      if (frameUrl) URL.revokeObjectURL(frameUrl);
      frameUrl = u; frameMisses = 0; clearErr("berr");
    }).catch(function (e) {
      frameMisses += 1;
      if (frameMisses === 1) {
        showErr("berr", e.message);
        sel.key = ""; sel.targetId = "";
        setTimeout(loadBrowsers, 0);
      }
    }).then(function () { frameBusy = false; });
  }
  setInterval(tickFrame, 500);

  // The picture is letterboxed by object-fit: contain, so map the pointer onto the picture itself.
  function fraction(ev) {
    var r = bframe.getBoundingClientRect(), nw = bframe.naturalWidth, nh = bframe.naturalHeight;
    if (!nw || !nh || !r.width || !r.height) return null;
    var scale = Math.min(r.width / nw, r.height / nh), w = nw * scale, h = nh * scale;
    var x = (ev.clientX - (r.left + (r.width - w) / 2)) / w, y = (ev.clientY - (r.top + (r.height - h) / 2)) / h;
    if (!(x >= 0 && x <= 1 && y >= 0 && y <= 1)) return null;
    return { x: Math.round(x * 1e4) / 1e4, y: Math.round(y * 1e4) / 1e4 };
  }
  function sendInput(ev) {
    if (!sel.key || !sel.targetId) { showErr("berr", "Select a tab first."); return; }
    var body = { viewer: viewer, key: sel.key, targetId: sel.targetId, event: ev };
    if (session) body.session = session;
    post("/view/browser/input", body).then(function () { clearErr("berr"); }).catch(function (e) { showErr("berr", e.message); });
  }
  function buttonOf(ev) { return ev.button === 2 ? "right" : ev.button === 1 ? "middle" : "left"; }
  bframe.addEventListener("pointerdown", function () { bframe.focus(); });
  bframe.addEventListener("click", function (ev) { var f = fraction(ev); if (f) sendInput({ type: "click", x: f.x, y: f.y, button: buttonOf(ev) }); });
  bframe.addEventListener("dblclick", function (ev) { var f = fraction(ev); if (f) sendInput({ type: "dblclick", x: f.x, y: f.y }); });
  bframe.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
  bframe.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var f = fraction(ev);
    if (f) sendInput({ type: "scroll", x: f.x, y: f.y, dx: Math.round(ev.deltaX), dy: Math.round(ev.deltaY) });
  }, { passive: false });
  var KEYS = { Enter: 1, Backspace: 1, Tab: 1, Escape: 1, Delete: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1, Home: 1, End: 1, PageUp: 1, PageDown: 1 };
  bframe.addEventListener("keydown", function (ev) {
    if (!KEYS[ev.key] || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    ev.preventDefault();
    sendInput({ type: "key", key: ev.key });
  });
  $("back").addEventListener("click", function () { sendInput({ type: "back" }); });
  $("fwd").addEventListener("click", function () { sendInput({ type: "forward" }); });
  $("reload").addEventListener("click", function () { sendInput({ type: "reload" }); });
  function navigate() { var u = urlEl.value.trim(); if (u) sendInput({ type: "navigate", url: u }); }
  function typeText() { var t = textEl.value; if (t) sendInput({ type: "text", text: t }); }
  $("go").addEventListener("click", navigate);
  $("send").addEventListener("click", typeText);
  textEl.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); typeText(); } });
  $("novnc").addEventListener("click", function () {
    if (!sel.key) { showErr("berr", "Select a tab first."); return; }
    if (!sel.novnc) { showErr("berr", "This browser has no noVNC observer (sandbox browser only)."); return; }
    post("/view/novnc", { key: sel.key, open: true }).then(function (j) {
      if (!j || !j.url) throw new Error("no noVNC URL returned");
      clearErr("berr"); window.open(j.url, "_blank", "noopener");
    }).catch(function (e) { showErr("berr", e.message); });
  });
  loadBrowsers();
  setInterval(loadBrowsers, 3000);

  // ── desktop: the control lease plus a PNG frame every ~1 s ──
  function renderLease(j) {
    if (!j || !j.lease) return;
    var l = j.lease, s = "holder: " + l.holder + " · epoch: " + l.epoch;
    if (l.reason) s += " · reason: " + l.reason;
    s += j.viewerHolds ? " · you hold it" : " · you do not hold it";
    if (!j.botDesktop) s += " · no Bot Desktop on this machine";
    leaseEl.textContent = s;
    $("take").disabled = !!j.viewerHolds;
    $("hand").disabled = !j.viewerHolds;
  }
  function desktopState() {
    return apiJson("/view/desktop?viewer=" + encodeURIComponent(viewer))
      .then(function (j) { renderLease(j); clearErr("derr"); }).catch(function (e) { showErr("derr", e.message); });
  }
  var deskUrl = "", deskBusy = false, deskMisses = 0;
  function tickDesktop() {
    if (deskBusy) return;
    deskBusy = true;
    api("/view/desktop/frame").then(function (r) { return r.blob(); }).then(function (blob) {
      var u = URL.createObjectURL(blob);
      dframe.src = u;
      if (deskUrl) URL.revokeObjectURL(deskUrl);
      deskUrl = u; deskMisses = 0; clearErr("derr");
    }).catch(function (e) { deskMisses += 1; if (deskMisses === 1) showErr("derr", e.message); })
      .then(function () { deskBusy = false; });
  }
  setInterval(tickDesktop, 1000);
  var LEASE = { takeover: "/view/desktop/takeover", handback: "/view/desktop/handback" };
  function lease(action) {
    var body = action === "takeover" ? { viewer: viewer, reason: "live view" } : { viewer: viewer };
    post(LEASE[action], body).then(function (j) { renderLease(j); clearErr("derr"); return desktopState(); })
      .catch(function (e) { showErr("derr", e.message); });
  }
  $("take").addEventListener("click", function () { lease("takeover"); });
  $("hand").addEventListener("click", function () { lease("handback"); });
  desktopState();
  setInterval(desktopState, 3000);
})();
</script>
</body>
</html>
