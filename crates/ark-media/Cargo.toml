[package]
name = "ark-media"
version.workspace = true
edition.workspace = true
license.workspace = true
# Media capabilities: vision, document extraction, image/video/music generation,
# speech (TTS/STT), realtime voice, voice mode, meeting bots and phone calls.

[features]
# Personal-desktop voice front-ends (gen1-306): voice mode, wake word, realtime
# speech-to-speech sessions and GPT-Live. Off by default; `ark` enables it with
# `--features personal`.
personal = []

[dependencies]
ark-core.workspace = true
ark-net.workspace = true
ark-security.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
base64.workspace = true
libc.workspace = true
# Decode/resize/re-encode images before they reach a model (Hermes Pillow, OpenClaw sharp).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Inflate for PDF FlateDecode streams and OOXML/ODF zip members (already in the tree through png).
miniz_oxide = "0.9"
