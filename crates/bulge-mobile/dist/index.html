<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Bulge Remote</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></symbol>
    <symbol id="i-send" viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></symbol>
    <symbol id="i-scan" viewBox="0 0 16 16"><path d="M2 5V3.5C2 2.7 2.7 2 3.5 2H5M11 2h1.5c.8 0 1.5.7 1.5 1.5V5M14 11v1.5c0 .8-.7 1.5-1.5 1.5H11M5 14H3.5C2.7 14 2 13.3 2 12.5V11M2 8h12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></symbol>
    <symbol id="i-chev" viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5"/></symbol>
  </svg>

  <section id="home" class="screen grid-canvas">
    <header class="large">
      <div class="eyebrow"><span class="brand-mark" aria-hidden="true"></span>BULGE REMOTE</div>
      <h1>你的 bulge</h1>
    </header>
    <div class="section-label">已配對的電腦</div>
    <ul id="hosts" class="list"></ul>
    <p id="no-hosts" class="hint" hidden>還沒有配對任何 bulge。在電腦上執行 <code>bulge remote pair</code>，再按下面的按鈕掃描 QR code。</p>
    <div class="dock">
      <button id="go-pair" class="primary"><svg class="icon"><use href="#i-plus"/></svg>配對新的 bulge</button>
    </div>
  </section>

  <section id="pair" class="screen grid-canvas" hidden>
    <header class="bar"><button class="back" data-to="home" aria-label="返回"><svg class="icon"><use href="#i-back"/></svg>返回</button><h1>配對</h1></header>
    <button id="scan" class="primary"><svg class="icon"><use href="#i-scan"/></svg>掃描 QR code</button>
    <div class="section-label">或手動輸入</div>
    <div class="group">
      <label>配對連結
        <textarea id="link" rows="3" placeholder="bulge-pair:…" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
      </label>
      <label>這台 bulge 叫什麼<input id="host-name" value="bulge" autocapitalize="off"></label>
      <label>這支手機在 bulge 上的名稱<input id="device-name" value="phone" autocapitalize="off"></label>
    </div>
    <button id="do-pair" class="primary">配對</button>
    <p class="hint">連結只能用一次、10 分鐘內有效。它含有密鑰，請直接掃描或複製，不要經聊天軟體轉傳。</p>
    <p id="pair-error" class="error" hidden></p>
  </section>

  <section id="chat" class="screen chat grid-canvas" hidden>
    <header class="bar">
      <button class="back" data-to="home" aria-label="返回"><svg class="icon"><use href="#i-back"/></svg></button>
      <div class="bar-title">
        <h1 id="chat-title"></h1>
        <p id="status" class="status">連線中…</p>
      </div>
    </header>
    <ol id="messages"></ol>
    <form id="compose">
      <div class="capsule">
        <textarea id="text" rows="1" placeholder="交辦任務⋯ 打 / 看指令"></textarea>
        <button class="primary send" type="submit" aria-label="送出"><svg class="icon"><use href="#i-send"/></svg></button>
      </div>
    </form>
  </section>

  <script src="palette.js"></script>
  <script src="app.js"></script>
</body>
</html>
