[package]
name = "ark-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ark-core.workspace = true
ark-security.workspace = true
serde.workspace = true
serde_json.workspace = true
regex = { workspace = true, features = ["unicode-case"] } # case-insensitive grep
libc.workspace = true
ark-net.workspace = true # sha256 / random ids / base64 for web caches and envelopes
ureq.workspace = true
toml.workspace = true # post-write TOML syntax lint (existing workspace dep)
ark-vm.workspace = true # microVM exec backend (B1): the `vm` backend delegates to ark-vm
base64.workspace = true # base64 frames on the guest channel (ark-vm protocol)
