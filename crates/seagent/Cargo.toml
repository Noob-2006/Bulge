[package]
name = "seagent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "seagent"
path = "src/main.rs"

# Everything on by default: the historical build. `--no-default-features` drops the
# optional chat platforms and the extra model adapters (see docs/BUILD.md for the
# measured sizes and what is lost).
[features]
default = ["channel", "providers"]
# Personal-desktop modules (gen1-306), NOT in the default binary: voice mode, wake word,
# GPT-Live / realtime speech-to-speech, the Chrome-extension relay and real-profile import.
# `cargo build -p seagent --features personal` brings them (and their tests) back.
personal = ["seagent-media/personal", "seagent-browser/personal"]
# Chat channels: every platform (`seagent-channel/all`).
channel = ["seagent-channel/all", "seagent-app/channel"]
# Optional model adapters; off only with `--no-default-features` (docs/BUILD.md).
providers = [
    "seagent-app/providers",
    "seagent-kernel/providers",
    "seagent-memory/providers",
    "seagent-plugin/providers",
    "seagent-skills/providers",
    "seagent-model/full",
]

[dependencies]
seagent-core.workspace = true
seagent-kernel = { path = "../seagent-kernel", default-features = false }
seagent-model = { path = "../seagent-model", default-features = false }
seagent-tools.workspace = true
seagent-vm.workspace = true # `seagent sandbox vm` / isolation reporting (B1)
seagent-plugin = { path = "../seagent-plugin", default-features = false }
# Same crate as the workspace entry, but with its features OFF by default so this crate's
# `default` feature above decides (cargo cannot override `default-features` through
# `workspace = true`).
seagent-channel = { path = "../seagent-channel", default-features = false }
seagent-app = { path = "../seagent-app", default-features = false }
seagent-browser.workspace = true
seagent-net.workspace = true
seagent-security.workspace = true
seagent-skills = { path = "../seagent-skills", default-features = false }
seagent-memory = { path = "../seagent-memory", default-features = false }
seagent-media.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
libc.workspace = true
ureq.workspace = true
regex.workspace = true
base64.workspace = true
ring.workspace = true

# musl's default malloc is slow under many threads (the daemon runs a thread per connection/turn);
# the static release builds use mimalloc there. glibc builds keep the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
# `cdp::fake` is test-only in seagent-browser; enable it for this crate's unit tests.
seagent-browser = { workspace = true, features = ["test-util"] }
