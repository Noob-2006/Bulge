[package]
name = "seagent-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
# microVM execution environment: provider detection (Firecracker / QEMU / bwrap),
# guest image + lifecycle, the vsock guest channel, workspace snapshots and
# trust-tiered VM pools. No dependency on seagent-tools (the ExecBackend glue lives
# there) and no dependency on the kernel, so the guest agent stays tiny.

[dependencies]
serde.workspace = true
serde_json.workspace = true
seagent-net.workspace = true        # sha256 for image / snapshot manifests
base64.workspace = true
libc.workspace = true           # AF_VSOCK in the guest agent, process groups
# gunzip of the guest image initramfs: the desktop VM gets the same agent binary (desktop/agent.rs).
# Already in the tree (png pulls it in); default rust backend, no C code.
flate2 = "1"

# Windows port (docs/cross-platform.md): the VMM process runs in a Job Object (memory/CPU caps,
# kill-on-close), WHPX is probed through WinHvPlatform.dll, the VirtualBox / Hyper-V serial
# channel is a named pipe. Same windows-sys 0.52 the workspace (and ring) already pull in; only
# three more API families are enabled here (the registry one reads the Windows EditionID, so a
# Home edition is reported as "no Hyper-V role" rather than "Hyper-V not installed"); Win32_UI_Shell
# (+ WindowsAndMessaging, its show-command type) opens the Windows Features dialog for the GUI's
# "turn on Windows Hypervisor Platform" button.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
seagent-core.workspace = true       # tests only: self-cleaning scratch dirs

[[bin]]
name = "seagent-vm-guest"
path = "src/bin/seagent-vm-guest.rs"
