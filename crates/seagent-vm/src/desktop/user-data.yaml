#cloud-config
# seagent desktop VM provisioning (served once by `seagent vm desktop build` over the
# NoCloud HTTP seed). {{PACKAGES}} is filled in by seagent-vm/src/desktop/image.rs; screen size and start URL
# come from SMBIOS OEM strings at every boot (no rebuild to change them).
hostname: seagent-desktop
users:
  - name: seagent
    gecos: seagent desktop
    shell: /bin/bash
    groups: [audio, video, plugdev, netdev, sudo]
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
growpart:
  mode: auto
  devices: ["/"]
write_files:
  - path: /etc/lightdm/lightdm.conf.d/50-seagent.conf
    content: |
      [Seat:*]
      autologin-user=seagent
      autologin-user-timeout=0
      autologin-session=xfce
      user-session=xfce
      xserver-command=X -s 0 -dpms
      display-setup-script=/usr/local/bin/seagent-display-setup
  - path: /usr/local/bin/seagent-display-setup
    permissions: "0755"
    content: |
      #!/bin/sh
      # seagent passes per-VM settings as SMBIOS OEM strings (type 11): seagent-res=WxH, seagent-url=URL.
      # This runs as root before the session; it publishes them for the user's autostart.
      oem=$(cat /sys/firmware/dmi/entries/11-*/raw 2>/dev/null | tr '\000' '\n' | grep -a '^seagent-')
      res=$(echo "$oem" | sed -n 's/^seagent-res=//p' | head -n1)
      url=$(echo "$oem" | sed -n 's/^seagent-url=//p' | head -n1)
      # seagent-tz=Area/City: the host's time zone (no string = keep the image's UTC).
      tz=$(echo "$oem" | sed -n 's/^seagent-tz=//p' | head -n1)
      case "$tz" in
        ''|*..*|/*|*[!A-Za-z0-9_+/-]*) ;;
        *) [ -f "/usr/share/zoneinfo/$tz" ] && ln -sf "/usr/share/zoneinfo/$tz" /etc/localtime && echo "$tz" > /etc/timezone ;;
      esac
      mkdir -p /run/seagent
      printf '%s\n' "${url:-about:blank}" > /run/seagent/start-url
      chmod 0644 /run/seagent/start-url
      out=$(xrandr 2>/dev/null | awk '/ connected/{print $1; exit}')
      [ -n "$out" ] && [ -n "$res" ] && xrandr --output "$out" --mode "$res" 2>/dev/null
      xset s off -dpms 2>/dev/null
      exit 0
  - path: /usr/local/bin/seagent-start-browser
    permissions: "0755"
    content: |
      #!/bin/sh
      xset s off -dpms 2>/dev/null
      sleep 3
      url=$(cat /run/seagent/start-url 2>/dev/null || echo about:blank)
      # DevTools on guest loopback (seagent's browser tools drive this window through it; the
      # relay below carries it to the host). Chromium ignores --remote-debugging-port on its
      # default profile directory, hence the explicit one.
      exec chromium --no-first-run --no-default-browser-check --password-store=basic --disable-features=Translate,MediaRouter --start-maximized \
        --user-data-dir="$HOME/.config/seagent-chromium" --remote-debugging-port=9222 "$url"
  - path: /etc/xdg/autostart/seagent-chromium.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Name=Chromium (seagent)
      Exec=/usr/local/bin/seagent-start-browser
      X-GNOME-Autostart-enabled=true
  # The host reaches the DevTools port only through QEMU's user-mode hostfwd to guest port
  # 9223 (bound to 127.0.0.1 on the host); nothing else can route into a user-mode guest.
  - path: /etc/systemd/system/seagent-cdp-relay.service
    content: |
      [Unit]
      Description=seagent: relay Chromium DevTools to the host
      After=network-online.target
      [Service]
      ExecStart=/usr/bin/socat TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222
      Restart=always
      RestartSec=2
      DynamicUser=yes
      [Install]
      WantedBy=multi-user.target
  # Text channel for characters a US keyboard cannot type (CJK …): the host writes one
  # base64 line per text to virtio-serial port org.seagent.text; the session pastes it (xclip +
  # ctrl+v via xdotool) and answers "ok".
  - path: /etc/udev/rules.d/99-seagent-text.rules
    content: |
      SUBSYSTEM=="virtio-ports", ATTR{name}=="org.seagent.text", OWNER="seagent", MODE="0600"
  - path: /usr/local/bin/seagent-text-input
    permissions: "0755"
    content: |
      #!/bin/sh
      port=/dev/virtio-ports/org.seagent.text
      # The port reads EOF while the host side is closed, so poll; the host keeps its end open
      # until it gets the "ok" line back, so nothing is lost between polls.
      # Never die: a host that gave up before the "ok" makes the write fail (SIGPIPE), and a
      # failed `exec` redirection ends a POSIX shell — so ignore SIGPIPE and open the port in
      # a subshell; the outer loop always comes back.
      trap '' PIPE
      while :; do
        [ -r "$port" ] && (
          exec 3<>"$port" || exit 0
          while IFS= read -r line <&3; do
            # Paste through the clipboard: xdotool's Unicode typing remaps one spare keycode
            # per character and Chromium was seen reading stale mappings (wrong characters).
            if printf '%s' "$line" | base64 -d > "$HOME/.seagent-text" 2>/dev/null; then
              # `3>&-`: xclip stays in the background to serve the clipboard; holding the
              # port would keep it busy (virtio ports have one opener) and block every later text.
              xclip -selection clipboard -i < "$HOME/.seagent-text" 3>&-
              sleep 0.2
              xdotool key --clearmodifiers ctrl+v 3>&-
              sleep 0.2
            fi
            rm -f "$HOME/.seagent-text"
            echo ok >&3 || true
          done
        )
        sleep 1
      done
  - path: /etc/xdg/autostart/seagent-text-input.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Name=seagent text input
      Exec=/usr/local/bin/seagent-text-input
      NoDisplay=true
  # The in-VM shell: seagent's guest agent (seagent-vm-guest, `service` role) on virtio-serial
  # port seagent0. It starts as root (the port and the fw_cfg channel key are root-only), then
  # drops to the desktop user for good, so the agent's shell commands run as `seagent` in
  # ~/workspace with DISPLAY=:0 — on the screen the person watches. KillMode=process: GUI
  # programs a command started stay up when the agent restarts.
  - path: /etc/systemd/system/seagent-agent.service
    content: |
      [Unit]
      Description=seagent: in-VM shell agent (host channel on virtio port seagent0)
      After=systemd-udevd.service
      [Service]
      ExecStart=/usr/local/sbin/seagent-agent-start
      Restart=always
      RestartSec=1
      KillMode=process
      [Install]
      WantedBy=multi-user.target
  - path: /usr/local/sbin/seagent-agent-start
    permissions: "0755"
    content: |
      #!/bin/sh
      # The host hands its own agent at every boot by fw_cfg (opt/seagent/agent: always its
      # protocol, no image rebuild after an upgrade); the copy baked in at build time runs
      # when there is none. Only a binary that has the `service` role is ever started.
      modprobe qemu_fw_cfg 2>/dev/null || true
      bin=/usr/local/sbin/seagent-vm-guest
      f=/sys/firmware/qemu_fw_cfg/by_name/opt/seagent/agent/raw
      # The host sends one only when the baked copy is out of date. fw_cfg reads cost a VM exit
      # per byte (minutes for the binary), so a copy received once is kept on the disk and
      # reused while its size matches (the host sends the same binary until seagent upgrades).
      c=/var/lib/seagent/seagent-vm-guest
      if [ -r "$f" ]; then
        mkdir -p /var/lib/seagent
        size=$(cat /sys/firmware/qemu_fw_cfg/by_name/opt/seagent/agent/size 2>/dev/null)
        if [ -x "$c" ] && [ -n "$size" ] && [ "$(stat -c %s "$c")" = "$size" ] && "$c" roles 2>/dev/null | grep -q service; then
          bin=$c
        elif cat "$f" > /var/lib/seagent/agent.new && chmod 0755 /var/lib/seagent/agent.new && /var/lib/seagent/agent.new roles 2>/dev/null | grep -q service; then
          mv -f /var/lib/seagent/agent.new "$c"
          bin=$c
        fi
      fi
      exec "$bin" service
  - path: /usr/local/sbin/seagent-provision
    permissions: "0755"
    content: |
      #!/bin/sh
      # Install the desktop; the last line on the serial console is what the host waits for.
      set -e
      export DEBIAN_FRONTEND=noninteractive
      say() { echo "$1" > /dev/ttyS0 2>/dev/null || true; echo "$1"; }
      trap 'say SEAGENT_PROVISION_FAIL' EXIT
      say SEAGENT_PROVISION_START
      # The host picks the fastest Debian mirror ({{APT_MIRROR}}, empty = the image's
      # deb.debian.org); apt verifies the signed archive whichever mirror serves it.
      m='{{APT_MIRROR}}'
      if [ -n "$m" ]; then
        # Debian's cloud images name the archive in /etc/apt/mirrors/*.list (mirror+file://).
        for f in /etc/apt/mirrors/*.list /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
          [ -f "$f" ] && sed -i -E "s#https?://deb\.debian\.org/debian/?([[:space:]]|\$)#$m\1#g" "$f"
        done
        say "SEAGENT_APT_MIRROR $m"
      fi
      apt-get update
      apt-get install -y --no-install-recommends {{PACKAGES}}
      # zh_TW.UTF-8 available (UI language stays the image default).
      for l in en_US.UTF-8 zh_TW.UTF-8; do
        grep -q "^$l UTF-8" /etc/locale.gen 2>/dev/null || echo "$l UTF-8" >> /etc/locale.gen
      done
      locale-gen
      udevadm control --reload-rules || true
      systemctl set-default graphical.target
      systemctl enable lightdm
      systemctl enable seagent-cdp-relay.service
      # The agent binary, from the seed server this build booted from (the SMBIOS serial
      # names it: ds=nocloud;s=http://10.0.2.2:PORT/).
      seed=$(sed -n 's/.*;s=\(http:[^;]*\).*/\1/p' /sys/class/dmi/id/product_serial 2>/dev/null)
      a=/usr/local/sbin/seagent-vm-guest
      if [ -n "$seed" ] && python3 -c 'import sys, urllib.request; open(sys.argv[2], "wb").write(urllib.request.urlopen(sys.argv[1], timeout=120).read())' "${seed%/}/seagent-vm-guest" "$a.new" 2>/dev/null \
          && chmod 0755 "$a.new" && "$a.new" roles 2>/dev/null | grep -q service; then
        mv -f "$a.new" "$a"
        say "SEAGENT_AGENT_OK $(sha256sum "$a" | cut -d' ' -f1)"
      else
        rm -f "$a.new"
        say SEAGENT_AGENT_MISSING
      fi
      systemctl enable seagent-agent.service
      # Later boots have no seed: do not wait on datasources.
      touch /etc/cloud/cloud-init.disabled
      apt-get clean
      rm -rf /var/lib/apt/lists/*
      sync
      trap - EXIT
      say SEAGENT_PROVISION_OK
runcmd:
  - [/usr/local/sbin/seagent-provision]
power_state:
  mode: poweroff
  delay: now
  timeout: 60
  condition: true
