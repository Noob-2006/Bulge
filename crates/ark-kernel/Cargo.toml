[package]
name = "ark-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Model adapters that only some installs need (AWS Bedrock, Vertex/Gemini, the external
# agent CLIs, the hosted Agents API, managed llama.cpp). `default` keeps the build
# complete; the binary's `--no-default-features` build turns it off (docs/BUILD.md).
default = ["providers"]
providers = ["ark-model/full"]

[dependencies]
ark-core.workspace = true
ark-security.workspace = true
ark-model = { path = "../ark-model", default-features = false } # [auxiliary.<task>] routing + endpoint health (aux.rs); features via `providers`
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
libc.workspace = true
ureq.workspace = true # decision provider HTTP (OpenAI /decisions)
base64.workspace = true
