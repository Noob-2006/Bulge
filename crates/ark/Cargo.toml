[package]
name = "ark"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ark"
path = "src/main.rs"

# Everything on by default: the historical build. `--no-default-features` drops the
# optional chat platforms and the extra model adapters (see docs/BUILD.md for the
# measured sizes and what is lost).
[features]
default = ["channel", "providers"]
# Personal-desktop modules (gen1-306), NOT in the default binary: voice mode, wake word,
# GPT-Live / realtime speech-to-speech, the Chrome-extension relay and real-profile import.
# `cargo build -p ark --features personal` brings them (and their tests) back.
personal = ["ark-media/personal", "ark-browser/personal"]
# Chat channels: every platform (`ark-channel/all`).
channel = ["ark-channel/all", "ark-app/channel"]
# Optional model adapters; off only with `--no-default-features` (docs/BUILD.md).
providers = [
    "ark-app/providers",
    "ark-kernel/providers",
    "ark-memory/providers",
    "ark-plugin/providers",
    "ark-skills/providers",
    "ark-model/full",
]

[dependencies]
ark-core.workspace = true
ark-kernel = { path = "../ark-kernel", default-features = false }
ark-model = { path = "../ark-model", default-features = false }
ark-tools.workspace = true
ark-vm.workspace = true # `ark sandbox vm` / isolation reporting (B1)
ark-plugin = { path = "../ark-plugin", default-features = false }
# Same crate as the workspace entry, but with its features OFF by default so this crate's
# `default` feature above decides (cargo cannot override `default-features` through
# `workspace = true`).
ark-channel = { path = "../ark-channel", default-features = false }
ark-app = { path = "../ark-app", default-features = false }
ark-browser.workspace = true
ark-net.workspace = true
ark-security.workspace = true
ark-skills = { path = "../ark-skills", default-features = false }
ark-memory = { path = "../ark-memory", default-features = false }
ark-media.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
libc.workspace = true
ureq.workspace = true
regex.workspace = true
base64.workspace = true
ring.workspace = true

# musl's default malloc is slow under many threads (the daemon runs a thread per connection/turn);
# the static release builds use mimalloc there. glibc builds keep the system allocator.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
# `cdp::fake` is test-only in ark-browser; enable it for this crate's unit tests.
ark-browser = { workspace = true, features = ["test-util"] }
