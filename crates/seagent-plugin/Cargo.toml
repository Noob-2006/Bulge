[package]
name = "seagent-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Model adapters that only some installs need (AWS Bedrock, Vertex/Gemini, the external
# agent CLIs, the hosted Agents API, managed llama.cpp). `default` keeps the build
# complete; the binary's `--no-default-features` build turns it off (docs/BUILD.md).
default = ["providers"]
providers = ["seagent-kernel/providers"]

[dependencies]
seagent-core.workspace = true
seagent-security.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
seagent-net.workspace = true
toml.workspace = true # `[builtin_plugins.<name>]` settings tables
seagent-kernel = { path = "../seagent-kernel", default-features = false } # built-in plugins (`src/builtin`: tools + Hook + Slash integration)
fancy-regex = { version = "0.20", default-features = false, features = ["std", "unicode"] } # security-guidance rules use look-behind (already in the tree via seagent-security)

[target.'cfg(unix)'.dependencies]
libc.workspace = true # MCP server process groups / PDEATHSIG (transport.rs), localtime_r (achievements)

[target.'cfg(windows)'.dependencies]
# Local wall clock for achievements (SystemTimeToTzSpecificLocalTime). Same 0.52 ring pulls in.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Time"] }
