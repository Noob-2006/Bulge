#cloud-config
# ark desktop VM provisioning (served once by `ark vm desktop build` over the
# NoCloud HTTP seed). {{PACKAGES}} is filled in by ark-vm/src/desktop/image.rs; screen size and start URL
# come from SMBIOS OEM strings at every boot (no rebuild to change them).
hostname: ark-desktop
users:
  - name: ark
    gecos: ark desktop
    shell: /bin/bash
    groups: [audio, video, plugdev, netdev, sudo]
    lock_passwd: true
    sudo: "ALL=(ALL) NOPASSWD:ALL"
growpart:
  mode: auto
  devices: ["/"]
write_files:
  - path: /etc/lightdm/lightdm.conf.d/50-ark.conf
    content: |
      [Seat:*]
      autologin-user=ark
      autologin-user-timeout=0
      autologin-session=xfce
      user-session=xfce
      xserver-command=X -s 0 -dpms
      display-setup-script=/usr/local/bin/ark-display-setup
  - path: /usr/local/bin/ark-display-setup
    permissions: "0755"
    content: |
      #!/bin/sh
      # ark passes per-VM settings as SMBIOS OEM strings (type 11): ark-res=WxH, ark-url=URL.
      # This runs as root before the session; it publishes them for the user's autostart.
      oem=$(cat /sys/firmware/dmi/entries/11-*/raw 2>/dev/null | tr '\000' '\n' | grep -a '^ark-')
      res=$(echo "$oem" | sed -n 's/^ark-res=//p' | head -n1)
      url=$(echo "$oem" | sed -n 's/^ark-url=//p' | head -n1)
      mkdir -p /run/ark
      printf '%s\n' "${url:-about:blank}" > /run/ark/start-url
      chmod 0644 /run/ark/start-url
      out=$(xrandr 2>/dev/null | awk '/ connected/{print $1; exit}')
      [ -n "$out" ] && [ -n "$res" ] && xrandr --output "$out" --mode "$res" 2>/dev/null
      xset s off -dpms 2>/dev/null
      exit 0
  - path: /usr/local/bin/ark-start-browser
    permissions: "0755"
    content: |
      #!/bin/sh
      xset s off -dpms 2>/dev/null
      sleep 3
      url=$(cat /run/ark/start-url 2>/dev/null || echo about:blank)
      exec chromium --no-first-run --no-default-browser-check --password-store=basic --disable-features=Translate,MediaRouter --start-maximized "$url"
  - path: /etc/xdg/autostart/ark-chromium.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Name=Chromium (ark)
      Exec=/usr/local/bin/ark-start-browser
      X-GNOME-Autostart-enabled=true
  # Text channel for characters a US keyboard cannot type (CJK …): the host writes one
  # base64 line per text to virtio-serial port org.ark.text; the session pastes it (xclip +
  # ctrl+v via xdotool) and answers "ok".
  - path: /etc/udev/rules.d/99-ark-text.rules
    content: |
      SUBSYSTEM=="virtio-ports", ATTR{name}=="org.ark.text", OWNER="ark", MODE="0600"
  - path: /usr/local/bin/ark-text-input
    permissions: "0755"
    content: |
      #!/bin/sh
      port=/dev/virtio-ports/org.ark.text
      # The port reads EOF while the host side is closed, so poll; the host keeps its end open
      # until it gets the "ok" line back, so nothing is lost between polls.
      # Never die: a host that gave up before the "ok" makes the write fail (SIGPIPE), and a
      # failed `exec` redirection ends a POSIX shell — so ignore SIGPIPE and open the port in
      # a subshell; the outer loop always comes back.
      trap '' PIPE
      while :; do
        [ -r "$port" ] && (
          exec 3<>"$port" || exit 0
          while IFS= read -r line <&3; do
            # Paste through the clipboard: xdotool's Unicode typing remaps one spare keycode
            # per character and Chromium was seen reading stale mappings (wrong characters).
            if printf '%s' "$line" | base64 -d > "$HOME/.ark-text" 2>/dev/null; then
              # `3>&-`: xclip stays in the background to serve the clipboard; holding the
              # port would keep it busy (virtio ports have one opener) and block every later text.
              xclip -selection clipboard -i < "$HOME/.ark-text" 3>&-
              sleep 0.2
              xdotool key --clearmodifiers ctrl+v 3>&-
              sleep 0.2
            fi
            rm -f "$HOME/.ark-text"
            echo ok >&3 || true
          done
        )
        sleep 1
      done
  - path: /etc/xdg/autostart/ark-text-input.desktop
    content: |
      [Desktop Entry]
      Type=Application
      Name=ark text input
      Exec=/usr/local/bin/ark-text-input
      NoDisplay=true
  - path: /usr/local/sbin/ark-provision
    permissions: "0755"
    content: |
      #!/bin/sh
      # Install the desktop; the last line on the serial console is what the host waits for.
      set -e
      export DEBIAN_FRONTEND=noninteractive
      say() { echo "$1" > /dev/ttyS0 2>/dev/null || true; echo "$1"; }
      trap 'say ARK_PROVISION_FAIL' EXIT
      say ARK_PROVISION_START
      apt-get update
      apt-get install -y --no-install-recommends {{PACKAGES}}
      # zh_TW.UTF-8 available (UI language stays the image default).
      for l in en_US.UTF-8 zh_TW.UTF-8; do
        grep -q "^$l UTF-8" /etc/locale.gen 2>/dev/null || echo "$l UTF-8" >> /etc/locale.gen
      done
      locale-gen
      udevadm control --reload-rules || true
      systemctl set-default graphical.target
      systemctl enable lightdm
      # Later boots have no seed: do not wait on datasources.
      touch /etc/cloud/cloud-init.disabled
      apt-get clean
      rm -rf /var/lib/apt/lists/*
      sync
      trap - EXIT
      say ARK_PROVISION_OK
runcmd:
  - [/usr/local/sbin/ark-provision]
power_state:
  mode: poweroff
  delay: now
  timeout: 60
  condition: true
