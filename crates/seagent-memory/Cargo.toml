[package]
name = "seagent-memory"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Model adapters that only some installs need (AWS Bedrock, Vertex/Gemini, the external
# agent CLIs, the hosted Agents API, managed llama.cpp). `default` keeps the build
# complete; the binary's `--no-default-features` build turns it off (docs/BUILD.md).
default = ["providers"]
providers = ["seagent-kernel/providers"]

[dependencies]
seagent-core.workspace = true
seagent-kernel = { path = "../seagent-kernel", default-features = false }
# The builtin MEMORY.md / USER.md store (limits, scanner hook, staged-write replay) lives in
# seagent-tools' `memory` tool; reusing it keeps one implementation of the § store.
seagent-tools.workspace = true
# Read-time threat re-scan of recalled memories (H8).
seagent-security.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
ureq.workspace = true
seagent-net.workspace = true # seagent_net::http::builder — the one outbound client builder (proxy/CA/offline)
ring.workspace = true
base64.workspace = true
toml.workspace = true
