[package]
name = "bulge-app"
description = "Bulge desktop app (Tauri 2): delegate a task, watch it run in the sandbox VM, review and approve the diff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "bulge-app"
path = "src/main.rs"

[dependencies]
bulge-cli = { path = "../bulge-cli" }
bulge-core = { path = "../bulge-core" }
bulge-harness = { path = "../bulge-harness" }
bulge-vm = { path = "../bulge-vm" }
bulge-store = { path = "../bulge-store" }
bulge-llm = { path = "../bulge-llm" }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.clippy]
all = { level = "warn", priority = -1 }
