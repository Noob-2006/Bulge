[package]
name = "sandboxd"
description = "bulge guest daemon: runs inside the libkrun VM, serves host invocations over vsock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bulge-proto = { path = "../bulge-proto" }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "fs", "rt-multi-thread", "macros", "net", "io-util"] }
tokio-vsock = "0.7"
base64 = "0.22"
nix = { version = "0.30", features = ["user", "process"] }

[lints]
workspace = true
