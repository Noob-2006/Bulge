[package]
name = "bulge-cli"
description = "Headless bulge: run a job in the sandbox VM and stream its events as JSONL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bulge_cli"
path = "src/lib.rs"

[[bin]]
name = "bulge"
path = "src/main.rs"

[dependencies]
bulge-core = { path = "../bulge-core" }
bulge-guard = { path = "../bulge-guard" }
bulge-harness = { path = "../bulge-harness" }
bulge-llm = { path = "../bulge-llm" }
bulge-store = { path = "../bulge-store" }
bulge-vm = { path = "../bulge-vm" }

futures.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true

[lints]
workspace = true
