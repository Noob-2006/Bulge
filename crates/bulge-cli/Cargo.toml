[package]
name = "bulge-cli"
description = "Headless bulge: run a job in the sandbox VM and stream its events as JSONL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bulge_cli"
path = "src/lib.rs"

[[bin]]
name = "bulge"
path = "src/main.rs"

[dependencies]
bulge-runtime = { path = "../bulge-runtime" }
bulge-util = { path = "../bulge-util" }
bulge-core = { path = "../bulge-core" }
bulge-harness = { path = "../bulge-harness" }
bulge-llm = { path = "../bulge-llm" }
bulge-org = { path = "../bulge-org" }
bulge-store = { path = "../bulge-store" }
bulge-vm = { path = "../bulge-vm" }

futures.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "signal"] }
bulge-channels = { path = "../bulge-channels" }
bulge-remote = { path = "../bulge-remote", features = ["channel"] }
getrandom.workspace = true
sha2.workspace = true
tokio-util.workspace = true

[lints]
workspace = true
