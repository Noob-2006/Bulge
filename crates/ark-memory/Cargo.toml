[package]
name = "ark-memory"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Model adapters that only some installs need (AWS Bedrock, Vertex/Gemini, the external
# agent CLIs, the hosted Agents API, managed llama.cpp). `default` keeps the build
# complete; the binary's `--no-default-features` build turns it off (docs/BUILD.md).
default = ["providers"]
providers = ["ark-kernel/providers"]

[dependencies]
ark-core.workspace = true
ark-kernel = { path = "../ark-kernel", default-features = false }
# The builtin MEMORY.md / USER.md store (limits, scanner hook, staged-write replay) lives in
# ark-tools' `memory` tool; reusing it keeps one implementation of the § store.
ark-tools.workspace = true
# Read-time threat re-scan of recalled memories (H8).
ark-security.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
ureq.workspace = true
ring.workspace = true
base64.workspace = true
toml.workspace = true
