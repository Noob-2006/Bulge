d /var/lib/seagent 0750 seagent seagent -
d /var/lib/seagent/workspace 0750 seagent seagent -
d /var/cache/seagent 0750 seagent seagent -
d /var/log/seagent 0750 seagent seagent -
d /run/seagent 0750 seagent seagent -
