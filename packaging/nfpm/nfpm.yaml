# One nfpm definition for both .deb and .rpm (ent-006/007). Why nfpm and not cargo-deb +
# cargo-generate-rpm: seagent ships a prebuilt *static musl* binary plus a large share/ tree, two
# distro families need the same file layout, and nfpm needs no cargo plugin or rpmbuild/dpkg
# on the build host (it is a single Go binary; CI and build-packages.sh run it from its
# container). The cargo plugins would build the binary themselves (glibc, wrong baseline).
#
# Everything is substituted from the environment by packaging/nfpm/build-packages.sh:
#   VERSION, ARCH (amd64|arm64), SEAGENT_BIN, STAGE
name: seagent
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: utils
priority: optional
maintainer: seagent maintainers <seagent@users.noreply.github.com>
description: |
  SE Agent (System Engineering Agent): agent runtime with daemon, CLI, tools, sandboxing, audit.
  Static binary with bundled skills, roles and plugin catalog under /usr/share/seagent.
homepage: https://github.com/Noob-2006/System-Engineering-Agent
license: Apache-2.0
# The product was called `ark` and shipped as `ark-agent` (KDE's archiver owns the name `ark`).
# `seagent` takes over from it: an upgrade replaces the old package in place.
conflicts:
  - ark-agent
replaces:
  - ark-agent
provides:
  - ark-agent
# Static musl build: nothing to depend on. git and certificates are what the agent uses at run time.
recommends:
  - git
  - ca-certificates
contents:
  - src: ${SEAGENT_BIN}
    expand: true
    dst: /usr/bin/seagent
    file_info: { mode: 0755 }
  # skills, roles, catalogs, vm builder, sandbox-browser sources, units, managed-by-package marker
  # (seagent_core::share finds /usr/share/seagent from /usr/bin/seagent; `seagent update` refuses to replace it)
  - src: ${STAGE}/usr/share/seagent
    expand: true
    dst: /usr/share/seagent
    type: tree
  - src: ${STAGE}/usr/share/doc/seagent
    expand: true
    dst: /usr/share/doc/seagent
    type: tree
  # systemd: the system instance, generated from ops/service.rs (render_unit). postinstall.sh
  # rewrites it for systemd < 245 with `seagent service print --system` (ent-025).
  - src: ${STAGE}/usr/lib/systemd/system/seagentd.service
    expand: true
    dst: /usr/lib/systemd/system/seagentd.service
    file_info: { mode: 0644 }
  - src: ${STAGE}/usr/lib/sysusers.d/seagent.conf
    expand: true
    dst: /usr/lib/sysusers.d/seagent.conf
    file_info: { mode: 0644 }
  - src: ${STAGE}/usr/lib/tmpfiles.d/seagent.conf
    expand: true
    dst: /usr/lib/tmpfiles.d/seagent.conf
    file_info: { mode: 0644 }
  # /etc/seagent: administrator policy (seagent_kernel::managed) and, since ent-008, the system instance's
  # config.toml + secrets (seagent_core::layout::system::CONFIG). root:seagent 1770: the service account
  # can create and rewrite its own files, the sticky bit stops it replacing root-owned policy, and
  # the policy loader refuses any policy file not owned by root. The directories belong to the
  # package, the files in them never do, so an upgrade or removal cannot touch policy or config.
  - dst: /etc/seagent
    type: dir
    file_info: { mode: 01770, owner: root, group: seagent }
  - dst: /etc/seagent/managed.d
    type: dir
    file_info: { mode: 0755 }
  # OpenRC (Alpine): the systemd files above are inert there; this is the service.
  - src: ${STAGE}/etc/init.d/seagentd
    expand: true
    dst: /etc/init.d/seagentd
    packager: apk
    file_info: { mode: 0755 }
  - src: ${STAGE}/usr/share/seagent/examples/managed.toml
    expand: true
    dst: /etc/seagent/managed.toml.example
    type: config|noreplace
    file_info: { mode: 0644 }
scripts:
  preinstall: scripts/preinstall.sh
  postinstall: scripts/postinstall.sh
  preremove: scripts/preremove.sh
  postremove: scripts/postremove.sh
rpm:
  # EL7 (rpm 4.11) cannot read zstd/xz-by-default payloads.
  compression: gzip
  group: Applications/System
deb:
  compression: gzip
  fields:
    Bugs: https://github.com/Noob-2006/System-Engineering-Agent/issues
archlinux:
  packager: SE Agent maintainers <seagent@users.noreply.github.com>
  pkgbase: seagent
apk:
  # Unsigned here; the release workflow signs with its abuild key (`apk add --allow-untrusted`
  # for a local file).
  signature: {}
