[workspace]
resolver = "2"
members = ["crates/ark-core", "crates/ark-security", "crates/ark-kernel", "crates/ark-model", "crates/ark-tools", "crates/ark-plugin", "crates/ark-net", "crates/ark-channel", "crates/ark-skills", "crates/ark-memory", "crates/ark-browser", "crates/ark-media", "crates/ark-app", "crates/ark-vm", "crates/ark"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

# Dependency budget (see 架構設計-v0.md §6). Every entry needs a reason.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }          # serialization of every event / protocol type
serde_json = "1"                                          # JSON-RPC, JSONL log, provider wire formats
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde"] } # human config
ureq = { version = "3", default-features = false, features = ["rustls"] } # blocking HTTP+TLS, smallest tree
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] } # grep tool, secret patterns
libc = "0.2"                                              # process groups / signals for shell kill
# Already pulled in by ureq+rustls; used directly by ark-net for WebSocket, webhook signatures, OAuth PKCE.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
ring = "0.17"
base64 = "0.23"

ark-core = { path = "crates/ark-core" }
ark-security = { path = "crates/ark-security" }
ark-kernel = { path = "crates/ark-kernel" }
ark-model = { path = "crates/ark-model" }
ark-tools = { path = "crates/ark-tools" }
ark-plugin = { path = "crates/ark-plugin" }
ark-channel = { path = "crates/ark-channel" }
ark-net = { path = "crates/ark-net" }
ark-app = { path = "crates/ark-app" }
ark-skills = { path = "crates/ark-skills" }
ark-memory = { path = "crates/ark-memory" }
ark-browser = { path = "crates/ark-browser" }
ark-media = { path = "crates/ark-media" }
ark-vm = { path = "crates/ark-vm" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Size-first build: identical features, `opt-level = "z"` instead of "s".
# `cargo build -p ark --profile slim` — measured cost/benefit in docs/BUILD.md.
# It is a separate profile so the default `release` binary keeps its speed.
[profile.slim]
inherits = "release"
opt-level = "z"
