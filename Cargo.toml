[workspace]
resolver = "2"
members = ["crates/seagent-core", "crates/seagent-security", "crates/seagent-kernel", "crates/seagent-model", "crates/seagent-tools", "crates/seagent-plugin", "crates/seagent-net", "crates/seagent-channel", "crates/seagent-skills", "crates/seagent-memory", "crates/seagent-browser", "crates/seagent-media", "crates/seagent-app", "crates/seagent-vm", "crates/seagent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# 1.89: std `File::lock` / `try_lock` (stable since 1.89) replace `libc::flock`, so file locks work
# the same on Linux, macOS and Windows (docs/cross-platform.md, phase 1).
rust-version = "1.89"

# Dependency budget (see 架構設計-v0.md §6). Every entry needs a reason.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }          # serialization of every event / protocol type
serde_json = "1"                                          # JSON-RPC, JSONL log, provider wire formats
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde"] } # human config
ureq = { version = "3", default-features = false, features = ["rustls"] } # blocking HTTP+TLS, smallest tree
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] } # grep tool, secret patterns
libc = "0.2"                                              # process groups / signals for shell kill
# Already pulled in by ureq+rustls; used directly by seagent-net for WebSocket, webhook signatures, OAuth PKCE.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
ring = "0.17"
base64 = "0.23"
# Windows port (docs/cross-platform.md): Job Objects, named pipes, owner-only DACLs, console modes,
# ConPTY, system facts, OS RNG for `seagent_core::platform`. 0.52 is the version ring already pulls
# in on Windows, so this adds no new crate to the tree; only the API families used are enabled.
windows-sys = { version = "0.52", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
# iOS shell substitute (`exec.backend = "wasm"`, docs/cross-platform.md): a pure-Rust WebAssembly
# *interpreter* (MIT/Apache-2.0, no JIT — App Store policy forbids one — no C code, no unsafe
# platform calls). `std` + validation + `auto-dispatch` (tail-call dispatch only where the
# build guarantees tail calls, the loop otherwise — without it a debug build overflows the
# stack) + `simd` (uutils coreutils' wasm32-wasip1 build contains simd128 code paths); no `wat`
# text parser, no memory64. Linked on iOS and with seagent-tools' `wasm` feature; never in the
# default desktop/server binary. packaging/release/DEPENDENCY-REVIEW.md.
wasmi = { version = "2", default-features = false, features = ["std", "validate", "auto-dispatch", "simd"] }

seagent-core = { path = "crates/seagent-core" }
seagent-security = { path = "crates/seagent-security" }
seagent-kernel = { path = "crates/seagent-kernel" }
seagent-model = { path = "crates/seagent-model" }
seagent-tools = { path = "crates/seagent-tools" }
seagent-plugin = { path = "crates/seagent-plugin" }
seagent-channel = { path = "crates/seagent-channel" }
seagent-net = { path = "crates/seagent-net" }
seagent-app = { path = "crates/seagent-app" }
seagent-skills = { path = "crates/seagent-skills" }
seagent-memory = { path = "crates/seagent-memory" }
seagent-browser = { path = "crates/seagent-browser" }
seagent-media = { path = "crates/seagent-media" }
seagent-vm = { path = "crates/seagent-vm" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Size-first build: identical features, `opt-level = "z"` instead of "s".
# `cargo build -p seagent --profile slim` — measured cost/benefit in docs/BUILD.md.
# It is a separate profile so the default `release` binary keeps its speed.
[profile.slim]
inherits = "release"
opt-level = "z"
