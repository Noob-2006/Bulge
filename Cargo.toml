[workspace]
resolver = "2"
members = ["crates/seagent-core", "crates/seagent-security", "crates/seagent-kernel", "crates/seagent-model", "crates/seagent-tools", "crates/seagent-plugin", "crates/seagent-net", "crates/seagent-channel", "crates/seagent-skills", "crates/seagent-memory", "crates/seagent-browser", "crates/seagent-media", "crates/seagent-app", "crates/seagent-vm", "crates/seagent"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

# Dependency budget (see 架構設計-v0.md §6). Every entry needs a reason.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }          # serialization of every event / protocol type
serde_json = "1"                                          # JSON-RPC, JSONL log, provider wire formats
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde"] } # human config
ureq = { version = "3", default-features = false, features = ["rustls"] } # blocking HTTP+TLS, smallest tree
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] } # grep tool, secret patterns
libc = "0.2"                                              # process groups / signals for shell kill
# Already pulled in by ureq+rustls; used directly by seagent-net for WebSocket, webhook signatures, OAuth PKCE.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
ring = "0.17"
base64 = "0.23"

seagent-core = { path = "crates/seagent-core" }
seagent-security = { path = "crates/seagent-security" }
seagent-kernel = { path = "crates/seagent-kernel" }
seagent-model = { path = "crates/seagent-model" }
seagent-tools = { path = "crates/seagent-tools" }
seagent-plugin = { path = "crates/seagent-plugin" }
seagent-channel = { path = "crates/seagent-channel" }
seagent-net = { path = "crates/seagent-net" }
seagent-app = { path = "crates/seagent-app" }
seagent-skills = { path = "crates/seagent-skills" }
seagent-memory = { path = "crates/seagent-memory" }
seagent-browser = { path = "crates/seagent-browser" }
seagent-media = { path = "crates/seagent-media" }
seagent-vm = { path = "crates/seagent-vm" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Size-first build: identical features, `opt-level = "z"` instead of "s".
# `cargo build -p seagent --profile slim` — measured cost/benefit in docs/BUILD.md.
# It is a separate profile so the default `release` binary keeps its speed.
[profile.slim]
inherits = "release"
opt-level = "z"
