[workspace]
resolver = "3"
members = ["crates/bulge-proto", "crates/bulge-llm", "crates/bulge-vm", "crates/sandboxd", "crates/bulge-vmm", "crates/bulge-store", "crates/bulge-core", "crates/bulge-guard", "crates/bulge-harness", "crates/bulge-org", "crates/bulge-cli", "crates/bulge-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
bytes = "1"
futures = "0.3"
getrandom = "0.4"
hmac = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
