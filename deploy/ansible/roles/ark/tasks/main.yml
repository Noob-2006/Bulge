---
- name: ark | refuse unsupported inputs early
  ansible.builtin.assert:
    that:
      - ark_install_method in ['repo', 'package', 'tarball']
      - ansible_system == 'Linux'
      - ansible_architecture in ['x86_64', 'aarch64']
      - ark_install_method != 'repo' or (ark_repo_url | length > 0 and ark_repo_key_url | length > 0)
      - ark_install_method != 'package' or (ark_package_src | length > 0 and ark_package_checksum | length > 0)
      - ark_install_method != 'tarball' or (ark_tarball_src | length > 0 and ark_tarball_checksum | length > 0)
    fail_msg: "see roles/ark/README.md: set ark_install_method and the variables it needs"

- name: ark | install
  ansible.builtin.include_tasks: "install_{{ ark_install_method }}.yml"

- name: ark | organisation policy in /etc/ark/managed.toml
  ansible.builtin.template:
    src: managed.toml.j2
    dest: /etc/ark/managed.toml
    owner: root
    group: root
    mode: "0644"
    # ark refuses a policy file anyone else could write; this role writes exactly what it accepts
    validate: "/bin/sh -c 'test -s %s'"
  when: ark_managed_policy | length > 0
  notify: restart arkd

- name: ark | unattended setup (runs once; secrets only in this task's environment)
  ansible.builtin.command:
    argv: >-
      {{ [ark_bin, 'setup', '--non-interactive', '--no-service', '--provider', ark_provider]
         + (['--model', ark_model] if ark_model | length else [])
         + (['--base-url', ark_base_url] if ark_base_url | length else [])
         + (['--channel', ark_channel] if ark_channel | length else [])
         + (['--owner', ark_owner] if ark_owner | length else []) }}
  environment:
    ARK_HOME: "{{ ark_home }}"
    ARK_SETUP_API_KEY: "{{ ark_api_key }}"
    ARK_SETUP_CHANNEL_TOKEN: "{{ ark_channel_token }}"
  become: true
  become_user: "{{ ark_system_user }}"
  become_method: "{{ ark_become_method }}"
  become_flags: "{{ ark_become_flags | default(omit, true) }}"
  no_log: "{{ ark_setup_no_log }}"   # keep true: the task's environment carries the API key
  args:
    # setup rewrites config.toml (and keeps a .bak) on every run, so it only runs when there is none;
    # set ark_setup_force=true to apply changed provider/model/channel variables to an existing host
    creates: "{{ omit if ark_setup_force | bool else ark_home ~ '/config/config.toml' }}"
  when: ark_provider | length > 0
  notify: restart arkd

- name: ark | the system service (units come from the package; tarball installs get one printed by ark itself)
  ansible.builtin.service:
    name: arkd
    enabled: "{{ ark_service_enabled }}"
    state: "{{ ark_service_state }}"
  when: ark_service_enabled | bool and ansible_service_mgr == 'systemd'

- name: ark | prove it answers
  ansible.builtin.command: "{{ ark_bin }} --version"
  changed_when: false
