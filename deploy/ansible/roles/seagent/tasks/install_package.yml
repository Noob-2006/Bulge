---
- name: seagent | binary path
  ansible.builtin.set_fact:
    seagent_bin: /usr/bin/seagent

- name: seagent | fetch the package when it is a URL
  ansible.builtin.get_url:
    url: "{{ seagent_package_src }}"
    dest: "/var/tmp/{{ seagent_package_src | basename }}"
    checksum: "{{ seagent_package_checksum }}"
    mode: "0600"
  register: seagent_pkg_fetched
  when: seagent_package_src is match('^https://')

- name: seagent | copy the package from the controller
  ansible.builtin.copy:
    src: "{{ seagent_package_src }}"
    dest: "/var/tmp/{{ seagent_package_src | basename }}"
    mode: "0600"
  when: seagent_package_src is not match('^https://')

- name: seagent | the package file must hash to the pinned sha256 (take it from the verified SHA256SUMS)
  ansible.builtin.stat:
    path: "/var/tmp/{{ seagent_package_src | basename }}"
    checksum_algorithm: sha256
  register: seagent_pkg_stat

- name: seagent | refuse a package that is not the pinned one
  ansible.builtin.assert:
    that: seagent_pkg_stat.stat.checksum == (seagent_package_checksum | regex_replace('^sha256:', ''))
    fail_msg: "sha256 of {{ seagent_package_src | basename }} does not match seagent_package_checksum"

- name: seagent | install a .deb
  ansible.builtin.apt: { deb: "/var/tmp/{{ seagent_package_src | basename }}", state: present }
  when: ansible_os_family == 'Debian'

- name: seagent | install an .rpm
  ansible.builtin.package: { name: "/var/tmp/{{ seagent_package_src | basename }}", state: present, disable_gpg_check: true }  # integrity = the pinned sha256 above; use method "repo" for signature checking
  when: ansible_os_family in ['RedHat', 'Suse']
