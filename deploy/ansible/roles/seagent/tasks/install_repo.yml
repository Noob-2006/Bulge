---
- name: seagent | binary path
  ansible.builtin.set_fact:
    seagent_bin: /usr/bin/seagent

- name: seagent | apt repository (signed-by a dedicated keyring, never apt-key)
  when: ansible_os_family == 'Debian'
  block:
    - name: seagent | keyring directory
      ansible.builtin.file: { path: /etc/apt/keyrings, state: directory, mode: "0755" }
    - name: seagent | repository key
      ansible.builtin.get_url:
        url: "{{ seagent_repo_key_url }}"
        dest: /etc/apt/keyrings/seagent-archive-keyring.gpg
        mode: "0644"
    - name: seagent | sources entry
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/seagent-archive-keyring.gpg] {{ seagent_repo_url }}/apt stable main"
        filename: seagent
        state: present
    - name: seagent | package
      ansible.builtin.apt: { name: "seagent={{ seagent_version }}-1", state: present, update_cache: true }

- name: seagent | yum/dnf/zypper repository (gpgcheck and repo_gpgcheck on)
  when: ansible_os_family in ['RedHat', 'Suse']
  block:
    - name: seagent | yum repo file
      ansible.builtin.yum_repository:
        name: seagent
        description: seagent agent runtime
        baseurl: "{{ seagent_repo_url }}/rpm/$basearch"
        gpgcheck: true
        repo_gpgcheck: true
        gpgkey: "{{ seagent_repo_key_url }}"
      when: ansible_os_family == 'RedHat'
    - name: seagent | zypper repo
      community.general.zypper_repository:
        name: seagent
        repo: "{{ seagent_repo_url }}/rpm/{{ ansible_architecture }}"
        auto_import_keys: false
        state: present
      when: ansible_os_family == 'Suse'
    - name: seagent | package
      ansible.builtin.package: { name: "seagent-{{ seagent_version }}", state: present }
