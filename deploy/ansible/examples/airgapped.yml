---
# Air-gapped site: the tarball comes from the offline bundle on the controller, nothing is downloaded.
- name: seagent agent hosts (offline)
  hosts: seagent
  become: true
  roles:
    - role: seagent
      vars:
        seagent_install_method: tarball
        seagent_tarball_src: "{{ playbook_dir }}/../bundle/release/seagent-{{ ansible_architecture }}-unknown-linux-musl.tar.gz"
        seagent_tarball_checksum: "sha256:{{ vault_seagent_tarball_sha256 }}"   # from the verified release/SHA256SUMS
        seagent_provider: openai
        seagent_base_url: http://llm.internal:8000/v1
        seagent_model: local-model
