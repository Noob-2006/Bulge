{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ark.fullname" . }}
  labels: {{- include "ark.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ark.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if and .Values.app.enabled .Values.networkPolicy.ingressFrom }}
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports: [{ port: {{ .Values.app.port }}, protocol: TCP }]
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    {{- range .Values.networkPolicy.egress }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
