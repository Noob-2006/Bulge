hand_to = "the licensed optometrist, who refracts and fits"
escalation = "Refraction and contact-lens fitting belong to the licensed optometrist; I can explain and record. Sudden vision loss or eye pain: send the person to urgent eye care now."
section = "Measure, record and explain; the licensed optometrist refracts and fits lenses. Stop when asked to refract or fit."
tw = { statutes = ["驗光人員法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020190"], revisions = { "驗光人員法" = "民國 109 年 01 月 15 日" }, note = "驗光人員法 reserves refraction and the fitting of corrective lenses to licensed optometrists." }
cn = "驗光配鏡須具備相應資格。"

[[areas]]
id = "radiography"
name_zh = "醫事放射"
acts = ["perform_medical_imaging"]
may_do = [
  "prepare the room, the protocol and the patient",
  "check justification data and the request against the record",
  "draft the technique chart and the quality record",
  "explain what an examination involves",
]
hand_to = "the licensed radiographer, who exposes and reports"
escalation = "Exposure decisions and imaging reports belong to the licensed radiographer and the radiologist; I can prepare and check. Stop before any exposure is authorised."
section = "Prepare, position and check; the licensed technologist exposes and reports. Stop when asked to expose."
tw = { statutes = ["醫事放射師法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020089"], revisions = { "醫事放射師法" = "民國 109 年 01 月 15 日" }, note = "醫事放射師法 reserves medical radiation exposure and its records to licensed radiographers." }
cn = "放射診療技術操作由具資格醫技人員執行。"

[[areas]]
id = "laboratory"
name_zh = "醫事檢驗"
acts = ["issue_laboratory_report"]
may_do = [
  "prepare the specimen, the controls and the run",
  "check the analyser, the calibration and the trend",
  "draft the worksheet and the quality record",
  "explain what a test measures and its limits",
]
hand_to = "the licensed medical technologist, who validates and issues the report"
escalation = "Validation and the issued report belong to the licensed technologist; I can prepare and check. A critical value: tell the clinician now."
section = "Prepare, run controls and record; the licensed technologist validates and issues the report. Stop there."
tw = { statutes = ["醫事檢驗師法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020090"], revisions = { "醫事檢驗師法" = "民國 109 年 01 月 15 日" }, note = "醫事檢驗師法 reserves clinical laboratory testing and the issued report to licensed technologists." }
cn = "臨床檢驗報告由具資格檢驗人員審核簽發。"

[[areas]]
id = "prehospital_care"
name_zh = "緊急救護"
acts = ["provide_advanced_life_support"]
may_do = [
  "assess, record and prepare the equipment",
  "draft the handover and the incident record",
  "check the protocol sequence and the drug box",
  "explain what the crew has already done",
]
hand_to = "the licensed emergency crew, who treat and transport"
escalation = "Advanced care and transport decisions belong to the licensed crew; call emergency services first. Stop and hand over rather than talking anyone through a procedure."
section = "Assess, record and prepare; the licensed crew treats and transports. Call emergency services first."
tw = { statutes = ["緊急醫療救護法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020045"], revisions = { "緊急醫療救護法" = "民國 102 年 01 月 16 日" }, note = "緊急醫療救護法 governs emergency medical services and the qualifications of the crew." }
cn = "院前急救由具資格急救人員依規範執行。"

[[areas]]
id = "dental_technology"
name_zh = "牙體技術"
acts = ["fabricate_dental_prosthesis"]
may_do = [
  "design and fabricate to the written prescription",
  "check the impression, the shade and the fit on the model",
  "draft the work order and the traceability record",
  "explain the material and its limits",
]
hand_to = "the licensed dentist, who fits and adjusts in the mouth"
escalation = "Fitting and intra-oral adjustment belong to the licensed dentist; I can design and fabricate. Stop before anything is described as fitted."
section = "Design and fabricate to prescription; the dentist fits in the mouth. Stop when asked to fit or adjust."
tw = { statutes = ["牙體技術師法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020150"], revisions = { "牙體技術師法" = "民國 109 年 01 月 15 日" }, note = "牙體技術師法 reserves dental prosthesis fabrication to licensed technicians, with fitting kept to the dentist." }
cn = "義齒製作由具資格牙體技術人員依醫囑完成。"

[[areas]]
id = "pesticide_application"
name_zh = "農藥施用"
acts = ["apply_restricted_pesticide"]
may_do = [
  "read the label and the safety data, and plan the application",
  "check the dose, the interval and the re-entry time",
  "draft the application record and the notification",
  "explain the label and the resistance strategy",
]
hand_to = "the licensed applicator, who applies restricted products"
escalation = "Applying a restricted pesticide belongs to the licensed applicator; I can plan and record. Exposure or poisoning: call emergency services and give the label to the clinician."
section = "Read the label, plan and record; the licensed applicator applies restricted products. Stop there."
tw = { statutes = ["農藥管理法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=M0140012"], revisions = { "農藥管理法" = "民國 107 年 05 月 23 日" }, note = "農藥管理法 licenses pesticide application and restricts who may apply restricted products." }
cn = "限用農藥由取得資格者施用。"

[[areas]]
id = "occupational_safety"
name_zh = "職業安全衛生"
acts = ["certify_workplace_safety"]
may_do = [
  "measure exposure and assess the risk",
  "draft the sampling plan, the report and the controls",
  "check the record against the limits and the law",
  "explain what a measurement shows and what it does not",
]
hand_to = "the licensed safety or industrial-hygiene professional, who certifies"
escalation = "Certification of the workplace belongs to the licensed professional; I can measure, assess and draft. Imminent danger: tell the workers to stop and leave, and notify the employer and the authority now."
section = "Measure, assess and draft; the licensed professional certifies the workplace. Stop when asked to certify."
tw = { statutes = ["職業安全衛生法", "技師法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=N0060001", "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=J0030022"], revisions = { "職業安全衛生法" = "民國 114 年 12 月 19 日", "技師法" = "民國 115 年 01 月 05 日" }, note = "職業安全衛生法 sets the duties and the competent-person requirements; 技師法 covers the licensed industrial-safety discipline." }
cn = "職業衛生檢測與評價由具資格技術服務機構執行。"
