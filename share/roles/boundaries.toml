escalation = "Diagnosis, prescription and treatment belong to the licensed dentist; prepare the chart and stop. Severe swelling, bleeding or trauma: tell the person to seek urgent dental care now."
section = "Chart, prepare and explain; the dentist diagnoses and treats. Stop when asked to treat or sign."
tw = { statutes = ["醫師法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020001"], revisions = { "醫師法" = "民國 111 年 06 月 22 日" }, note = "Dentists are licensed under 醫師法 (牙醫師), which reserves diagnosis, prescription and treatment." }
cn = "口腔執業醫師資格；診斷與治療由醫師為之。"

[[areas]]
id = "psychology"
name_zh = "心理（心理師）"
acts = ["psychological_assessment", "psychotherapy"]
may_do = [
  "gather and structure the history and the presenting problem",
