section = "Gather and structure the history and draft formulations; the psychologist assesses and treats. Stop and refer."
tw = { statutes = ["心理師法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020098"], revisions = { "心理師法" = "民國 109 年 01 月 15 日" }, note = "心理師法 reserves psychological assessment and psychotherapy to licensed clinical and counselling psychologists." }
cn = "心理治療與心理測驗由取得資格的心理師執行。"

[[areas]]
