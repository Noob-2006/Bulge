# Professional-scope boundaries for the role packs.
#
# A regulated area names the acts the law keeps for a licensed or registered
# person (reserved acts), what an AI may do instead, the escalation wording, and
# the statutes behind it. Packs in a regulated area carry `regulated: true`, a
# `boundary: [...]` list of act ids from this file, and one short
# `## Scope and boundaries` section. Everything else carries `regulated: false`.
#
# Rules for this file:
#   - act ids are stable; packs reference them, so never rename one in place.
#   - Taiwan statute names were verified by fetching law.moj.gov.tw on
#     2026-11-05; each entry carries the URL used. Article numbers are
#     deliberately absent: none were verified, so none are cited.
#   - mainland China and the international notes describe the licensing regime
#     in words, not by citation, for the same reason.

version = 1
verified_on = "2026-11-05"
source_tw = "https://law.moj.gov.tw/"

[jurisdictions]
tw = "A reserved act may be performed only by the holder of the licence or registration named in the area. Preparing, drafting, checking and explaining are not reserved; signing, sealing, certifying, dispensing, declaring and deciding are. Unlicensed practice is a criminal or administrative offence in several of these statutes, so the AI never performs a reserved act and never signs as if it had."
cn = "Mainland China licenses the same acts through a qualification and registration system (執業資格＋註冊／備案), administered by the ministry for the field. The institution that holds the licence signs and files; an AI may prepare and check the material. Statutory names are not cited here because they were not verified for this round."
intl = "Elsewhere the same split normally holds: a licence, registration or statutory appointment is required for diagnosis, prescription, dispensing, certification, audit opinions, legal representation, sealed drawings, installations sign-off, clearances, advice to retail clients and statutory decisions. Check the local regulator before relying on any of it; where the local rule is unknown, treat the act as reserved and hand it to the professional of record."

