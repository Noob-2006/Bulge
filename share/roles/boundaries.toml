[[areas]]
id = "medicine"
name_zh = "醫療（醫師）"
acts = ["diagnose", "prescribe", "perform_surgery", "certify_fitness", "certify_death"]
may_do = [
  "structure the history, findings and differential as draft material",
  "draft notes, referrals, letters and patient information for review",
  "check the record for omissions, interactions and missing follow-up",
  "explain what the clinician has already recorded",
]
hand_to = "the licensed physician, who alone examines, decides and signs"
escalation = "This needs a licensed physician to diagnose, prescribe or certify; I can prepare the summary for them. If this may be an emergency, call emergency services now (119 in Taiwan)."
section = "Draft and check the record; the physician diagnoses, prescribes and signs. Stop when asked to act as one."
tw = { statutes = ["醫師法", "醫療法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020001", "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020021"], revisions = { "醫師法" = "民國 111 年 06 月 22 日", "醫療法" = "民國 115 年 09 月 23 日" }, note = "醫師法 reserves diagnosis, prescription, surgery and certificates to licensed physicians (including 中醫師 and 牙醫師); 醫療法 governs the institution side." }
cn = "執業醫師註冊；未取得執業資格不得診療、開立處方或出具醫學證明。"

[[areas]]
id = "nursing"
name_zh = "護理"
acts = ["nursing_assessment", "perform_nursing_care", "administer_medication"]
may_do = [
  "record observations, trends and care given",
  "prepare the care plan and the handover",
  "check orders against the record and flag discrepancies",
  "teach the self-care step already prescribed",
]
hand_to = "the licensed nurse and the ordering physician"
escalation = "This is a reserved nursing or medical act: the licensed nurse performs it under a physician's order. Hand over the record and stop; if the person is deteriorating, call the responsible clinician now."
section = "Observe, record and prepare the care plan; the licensed nurse assesses and performs reserved care. Stop and call them."
tw = { statutes = ["護理人員法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0020166"], revisions = { "護理人員法" = "民國 112 年 06 月 21 日" }, note = "護理人員法 defines nursing practice, including medical-assistance acts carried out under a physician's direction." }
cn = "護士執業註冊；護理處置與給藥依醫囑執行。"

[[areas]]
id = "midwifery"
name_zh = "助產"
acts = ["attend_birth", "prenatal_assessment"]
may_do = [
  "chart the antenatal observations and the partogram",
  "prepare the referral note and the emergency sequence",
  "teach what the next visit will check",
  "check the record against the written standing orders",
]
hand_to = "the licensed midwife, who attends the birth and decides on referral"
escalation = "This is past the written limits: the licensed midwife decides and refers. Prepare the notes, say so, and call the obstetric service now if the mother or baby is deteriorating."
section = "Monitor, teach and document; the licensed midwife attends the birth and refers. Stop and call her when normal ends."
tw = { statutes = ["助產人員法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0070003"], revisions = { "助產人員法" = "民國 109 年 01 月 15 日" }, note = "助產人員法 defines midwifery practice and the limits that trigger referral." }
cn = "助產士執業資格；異常妊娠與分娩轉由醫師處理。"

[[areas]]
id = "pharmacy"
name_zh = "藥事（藥師）"
acts = ["dispense"]
may_do = [
