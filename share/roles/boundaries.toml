section = "Check the prescription and prepare the counselling; the pharmacist dispenses. Stop and hand it over."
tw = { statutes = ["藥事法", "藥師法"], urls = ["https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0030001", "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=L0030066"], revisions = { "藥事法" = "民國 115 年 03 月 04 日", "藥師法" = "民國 109 年 01 月 15 日" }, note = "藥事法 and 藥師法 reserve dispensing, substitution and pharmacist counselling." }
cn = "執業藥師註冊；調劑與用藥指導由藥師為之。"

[[areas]]
