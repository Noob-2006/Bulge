# ark in GitLab CI: merge request review and test fixing.
#
# Use it from your .gitlab-ci.yml:
#
#   include:
#     - project: 'platform/ci-templates'      # where you keep this file (or `remote:` its raw URL)
#       ref: v1
#       file: '/ark.gitlab-ci.yml'
#   variables:
#     ARK_VERSION: "v1.4.0"                   # pin the release
#     ARK_CI_MODEL: "anthropic/claude-sonnet-4-5"
#
# CI/CD variables to define (Settings > CI/CD > Variables, masked and protected):
#   ANTHROPIC_API_KEY (or the key of the provider you use)   - for the model
#   GITLAB_TOKEN   a project access token with `api` scope   - only to post the review note;
#                  it is removed from the environment of the agent process
# Self-managed GitLab: nothing to change; the template uses $CI_API_V4_URL.
#
# The jobs below are manual-free for merge request pipelines (`ark-review`) and manual for
# `ark-fix-tests` (it runs your test command, so you choose when).

.ark-base:
  image: ${ARK_IMAGE:-debian:stable-slim}
  variables:
    ARK_VERSION: latest
    ARK_REPO: ark-agent/ark
    ARK_CI_OUT: .ark-ci
    ARK_CI_PROVIDER: gitlab
    GIT_DEPTH: "0"                       # the review diffs against the target branch
  before_script:
    - |
      if ! command -v ark >/dev/null 2>&1; then
        (apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git jq >/dev/null) 2>/dev/null || true
        ref="$ARK_VERSION"; [ "$ref" = latest ] && ref=main
        curl --proto '=https' --tlsv1.2 -fsSL "https://raw.githubusercontent.com/$ARK_REPO/$ref/packaging/install.sh" -o /tmp/ark-install.sh
        if [ "$ARK_VERSION" = latest ]; then ARK_INSTALL_DIR=/usr/local/bin sh /tmp/ark-install.sh; else ARK_INSTALL_DIR=/usr/local/bin sh /tmp/ark-install.sh --version "$ARK_VERSION"; fi
      fi
    - ark --version
    # ark-ci.sh comes from the same place as this template; copy it into your repo or fetch it:
    - 'test -f integrations/ci/ark-ci.sh || curl --proto "=https" --tlsv1.2 -fsSL "https://raw.githubusercontent.com/$ARK_REPO/${ARK_VERSION/latest/main}/integrations/ci/ark-ci.sh" -o /tmp/ark-ci.sh'
    - export ARK_CI_SCRIPT="$( [ -f integrations/ci/ark-ci.sh ] && echo integrations/ci/ark-ci.sh || echo /tmp/ark-ci.sh )"

ark-review:
  extends: .ark-base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
  variables:
    ARK_CI_BASE_BRANCH: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=200 || true
    - sh "$ARK_CI_SCRIPT" review
    - if [ -n "${GITLAB_TOKEN:-}" ]; then sh "$ARK_CI_SCRIPT" post; else echo "GITLAB_TOKEN not set - review not posted (see the job artifact)"; fi
  artifacts:
    when: always
    expire_in: 1 week
    paths: [.ark-ci/review.md]
  allow_failure: true                  # a review is advice; it must not block the merge

ark-fix-tests:
  extends: .ark-base
  stage: test
  rules:
    - if: '$ARK_CI_TEST_CMD && $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID'
      when: manual
      allow_failure: true
  script:
    - sh "$ARK_CI_SCRIPT" fix-tests
  artifacts:
    when: always
    expire_in: 1 week
    paths: [.ark-ci/fix.patch, .ark-ci/test.log]
