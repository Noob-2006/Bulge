# seagent 完整設定範例：~/.config/seagent/config.toml
# 每個鍵都可以省略。秘密一律放 `seagent secrets set NAME`，這裡用 {{secret:NAME}} 引用。
# 專案目錄的 .seagent/config.toml 也會被讀取，但 hooks / mcp / plugins / channels / providers / app
# 只有在本檔的 trusted_projects 列出該目錄時才生效。

# ───────────── 模型 ─────────────
[model]
default = "anthropic/claude-sonnet-5-5"
fallback = ["openai/gpt-5-mini", "mistral/mistral-small-latest"]
aux = "deepseek/deepseek-chat"     # 便宜模型：標題、MCP sampling（壓縮預設沿用對話模型以命中快取；要改設 [model.tasks] compaction）
max_tokens = 8192
# system_updates = "rewrite"       # 預設 rewrite；in_history = 中途的 system 變更接在快取歷史之後（端點支援才開）
# log_requests = false             # true = 每次送出的請求原樣寫進 session 紀錄（除錯快取未命中用；紀錄會變大）
# daybreak = false                 # true = 只在 openai-codex 路由送 access_programs.cyber = "daybreak_blue"
# context_length = 128000          # 釘選上下文視窗（/context 標 (pinned)）；未設且模型未知時標 (fallback)
# DeepSeek 的 Anthropic 相容路由（未對真實端點驗證）：default = "deepseek-messages/deepseek-v4-pro"

# [model.tasks]
# compaction = "deepseek/deepseek-chat"   # 明確指定才會用便宜模型壓縮（會放棄對話前綴快取）
# group_router = "deepseek/deepseek-chat" # hosted room 的 routing = "auto" 用來挑成員

[compaction]
trim_tool_results = "pressure"     # pressure（預設，超過 prune_threshold 才裁剪舊工具輸出）| always（舊行為）
# prune_threshold = 0.5

# [decision]                        # decision_evaluate 的 provider
# backend = "rerank"                # llm（預設）| openai | rerank（POST {base_url}/rerank：vLLM、TEI、Infinity、Cohere、Jina、Voyage）
# model = "local/bge-reranker-v2-m3"
# base_url = "http://127.0.0.1:8080"

[budget]                            # 每個 session 的上限（不設就無上限）
max_cost_usd = 5.0
max_steps = 300

# ───────────── 只有兩道閘門 ─────────────
[gate]
privilege = "ask"                   # sudo、寫系統路徑：ask | deny | allow
egress = "ask"                      # 秘密、個資、敏感檔案往外送
egress_allow = ["github.com"]
egress_deny = []

[schedule]
utc_offset_minutes = 480            # 排程時區 UTC+8

# ───────────── 排程投遞與自動維運（全部可省略，以下為預設值或範例）─────────────
# [automation]
# default_deliver = "slack:ops"           # 投遞：job → [automation.creators.<SEAGENT_PROFILE>] → [automation.agents.<agent>] → 這裡 → origin
# default_failure_deliver = "slack:oncall"
# agent = "ops"                           # 新工作記錄的擁有者 agent
# restart_hold_seconds = 3600             # 重啟時比這新的已認領工作恢復成待執行，更舊的記為 missed
# scratch_ttl_hours = 24                  # <data>/tmp、scratch、art、session artifacts 過期（0 關閉）
# worktree_idle_hours = 168               # 回收乾淨且閒置的 .worktrees/*（0 關閉）
# cleanup_interval_secs = 3600
# idle_session_secs = 1800                # seagentd 讓閒置 session 的記憶體狀態退場（0 關閉）
# plugin_auto_update_hours = 0            # 外掛無人值守更新（0 = 關；仍走掃描與同意）
# [automation.agents.ops]
# deliver = "slack:C123"
# failure_deliver = "slack:C999"
# [automation.creators.alice]
# deliver = "room:room-ab12"              # cron 輸出貼進 hosted room（不自動讓成員回話）

# ───────────── 子代理與代理對代理 ─────────────
# [delegation]
# prefix_stagger_seconds = 0              # 批次兄弟等第一個子代理的第一個串流片段再開始（最多 60）
# max_hops = 4                            # agent_message 鏈結上限
# ralph_max_rounds = 16
# ralph_max_handoff_chars = 16384
# [gateway.bot_loop_guard]
# max_hops = 3                            # 有設就蓋過 [delegation] max_hops

# ───────────── 子行程環境清洗 ─────────────
# 子行程（shell、背景工作、code mode、hooks、MCP、外掛、sandbox）看不到 seagent 管的憑證。
# env_passthrough 只放寬「名稱長得像憑證」這條啟發式規則（例如 *_TOKEN，但值其實是中介資料：
# build tag、資源 id）；它永遠不會放行憑證本身——Tier-1 秘密（GITHUB_TOKEN、各家 bot token）、
# provider 金鑰（OPENAI_API_KEY…）、env_strip 命中的名稱、AUXILIARY_*_API_KEY 一律移除。
[security]
scrub_env = true                    # 關閉 = 子行程拿到完整環境（不建議）
env_strip = ["CORP_*"]              # 額外要移除的名稱或 PREFIX_* 樣式
env_passthrough = ["BUILD_TOKEN"]   # 名稱像憑證但值是中介資料；憑證寫在這裡也沒用

# 逐供應商／模型的 exec 上限：只能收緊，/yolo、/elevated 也蓋不過；查原因用 `seagent tools explain <tool> --model M`
# [tools.by_provider."ollama".exec]
# mode = "ask"                       # deny | allowlist | ask | auto | full（或直接給 security / ask）

[exec]
scrub_env = true
env_passthrough = ["BUILD_ID"]
# [exec.code]
# run_code_only = false              # true = 模型只看得到 `run`，其他工具在腳本內用 seagent-call 呼叫
# backend 不寫 = "auto"：這台機器能開 microVM（/dev/kvm ＋ [exec.vm] 的客體映像）就用 VM；
# 開不了 VM（沒有 KVM 或沒建映像）時，所有 session（含 owner 主 session）都降級到 bwrap／Landlock，
# 主機家目錄與金鑰不掛入、owner session 保留網路，並印出「no microVM available（原因）＋怎麼修」。
# 連 namespace 沙箱都沒有才留在主機，警告開頭是「NOT ISOLATED」（srv-015：能隔離就不要詢問）。
# 寫死名稱（local/vm/bwrap/…）就照寫的用，不會被改寫；測試環境要固定主機執行就寫 backend = "local"。
# `seagent sandbox explain` 的 `execution plan:` 就是同一個答案。
# backend = "vm"
# [exec.sandbox]
# backend = "auto"    # 沙箱化的 session 也用同一個決策（VM 優先）


# ───────────── microVM 執行環境（GAPS B1–B5）─────────────
[exec.vm]
# auto = 有 KVM 就用 Firecracker，其次 QEMU；都沒有才退回 bwrap 並在
# `seagent sandbox explain` / 系統提示裡標明隔離等級較低（不會靜默降級）。
provider = "auto"                   # auto | firecracker | qemu | vfkit | virtualbox | hyperv | avf | gvisor | bwrap
# auto 依作業系統：Linux firecracker > qemu(KVM)；macOS vfkit(Virtualization.framework) > qemu(HVF) > virtualbox；
# Windows qemu(WHPX) > hyperv > virtualbox；沒有硬體加速時 qemu 以 TCG 執行（會明示警告）；Android avf；iOS 不支援 VM。
# vboxmanage = "VBoxManage"
# vfkit = "vfkit"
# disk_image = ""                   # VirtualBox / Hyper-V 用的可開機 UEFI raw 磁碟（預設 <data>/vm/kernel/disk.raw）
allow_fallback = true               # false = 寧可拒絕執行，也不要降級
# 客體映像：`seagent sandbox vm image build`（packaging/vm/build-image.sh）會下載
# 官方 kernel 與 Alpine rootfs、放入 seagent-vm-guest，並寫 manifest.json。
# kernel   = "~/.local/share/seagent/vm/image/vmlinux"
# initramfs = "~/.local/share/seagent/vm/image/initramfs.cpio.gz"
firecracker = "firecracker"         # 或 <data>/vm/bin/firecracker（免 root 的解壓縮檔）
vcpu = 2
memory_mb = 1024
max_processes = 512                 # 客體 RLIMIT_NPROC：VM 內的 fork 炸彈死在自己家裡
cpu_seconds = 0                     # 每個 VM 的 CPU 總額度（0 = 不限，僅每道指令逾時）
idle_timeout_secs = 1800            # 閒置回收
workspace_access = "rw"             # rw = 靠快照回復（預設）；ro 只給明確標示的敏感目錄
workspace_max_mb = 512              # 同步上限，超過就拒絕而不是默默截斷
network = "broker"                  # 客體沒有網卡，只能經 seagent-broker 向 daemon 請求
snapshots = true                    # 破壞性指令先快照再放行（undo 取代詢問）
snapshot_keep = 20
trust_tiers = true                  # owner / stranger / untrusted 各自獨立的 VM 與工作區

# ───────────── 記憶、知識庫、技能工坊 ─────────────
# [memory.recall_gate]
# mode = "off"                       # off | shadow（只記 <data>/logs/recall-gate.jsonl）| live（注入）
# high_threshold = 0.75
# timeout_ms = 1500
# max_candidates = 10
# page_chars = 2800
# max_inject_chars = 6000
# store = ""                         # 空 = 預設知識庫
# model = ""                         # 空 = aux
# [memory.wiki]
# agent_id = ""                      # 空 = $SEAGENT_AGENT
# agents = []                        # 可用預設庫的代理（空 = 全部）
# history = true                     # 每次改寫前存舊頁到 .seagent-wiki/history/
# history_max = 50
# [memory.wiki.stores.ops]
# path = "~/kb/ops"
# agents = ["ops"]
# [memory.standing]
# enabled = false                    # 常駐提醒；用 `seagent memory intents add …` 新增
# max_intents = 50
# cooldown_secs = 3600
# max_fires = 3
# [memory.search.embedding]
# provider = "ollama"
# allow_private = true               # false = Ollama 只准 loopback；雲端 metadata 永遠拒絕
# [skills.workshop]
# mode = "off"                       # off | propose（草稿進 /skills drafts）| auto（經守衛直接寫入）
# llm_review = true
# model = ""                         # 空 = aux
# diet_max_bytes = 12000             # seagent curator diet 的 SKILL.md 本文預算（2000–100000）

# ───────────── 瀏覽器 ─────────────
# [browser]
# allow_private_urls = false         # 嚴格 SSRF：open/navigate 逐跳檢查轉址（Camofox 改為拒絕 http(s) 導航）

# ───────────── 法遵（docs/compliance-tw.md）─────────────
[compliance]
# profile = "government"            # 公部門：拒絕中國境內的模型與主機
retention_days = 180                # 超過天數的對話紀錄自動刪除

# ───────────── MCP servers ─────────────
[mcp.files]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/me/docs"]
exclude_tools = ["*delete*"]

[mcp.github]
url = "https://api.githubcopilot.com/mcp/"
auth = "oauth"                      # 之後執行 seagent mcp login github（或 --device）
trust = "untrusted"                 # 非唯讀工具每次都要核准
keepalive_secs = 120

[mcp.legacy]
url = "https://old.example.com/sse"
transport = "sse"                   # 2024-11-05 的 HTTP+SSE
headers = { Authorization = "Bearer {{secret:LEGACY_TOKEN}}" }
sampling = { enabled = true, max_rpm = 5, max_tokens_cap = 1024 }
tool_costs = { "generate_*" = 2.0 }
spend_limit = 50.0
cost_unit = "credits"

[mcp.tracker]
url = "https://mcp.tracker.example/mcp"
protocol = "auto"                   # auto（先 initialize，遇 2026-07-28 專用錯誤改 server/discover）| legacy | stateless
tasks = true                        # taskSupport = "optional" 的工具也以 task 執行（"required" 一律如此）
task_timeout_secs = 900             # 單一 task／URL elicitation 的上限
apps = true                         # MCP Apps：宣告 io.modelcontextprotocol/ui，網頁 UI 以沙箱 iframe 呈現 ui://
events = true                       # MCP events：mcp__tracker__events 工具（list/subscribe/unsubscribe）
events_url = "https://seagent.example.com/mcp-events"   # app server 對外 HTTPS 位址 + /mcp-events
sampling = { enabled = true, tools = true, max_tool_rounds = 8 }
oauth = { authorization_server = "https://auth.tracker.example" }   # 設定後 token 的 issuer 必須相符

# ───────────── Channels（46 種，見 docs/parity.md）─────────────
[channels.phone]
kind = "telegram"
token = "{{secret:TELEGRAM_TOKEN}}"
dm_policy = "pairing"               # allowlist（預設）| pairing | open | disabled
allow = ["123456789"]
group_policy = "allowlist"
groups = ["-1001234567890"]
require_mention = true
commands = true                     # 向 Telegram 註冊 /new /stop /status /help
privacy_notice = "本服務由 AI 回覆。你的訊息會送到模型供應商處理，保存 180 天。隱私權政策：https://example.com/privacy"
ai_label = "— 由 AI 生成"

[channels.team]
kind = "slack"
bot_token = "{{secret:SLACK_BOT_TOKEN}}"
app_token = "{{secret:SLACK_APP_TOKEN}}"   # Socket Mode
allow = ["*"]
group_policy = "open"
group_allow_all_members = true
# thread_history = 20                # 第一次在討論串被叫到時附上前文（conversations.replies）；0 關閉
# suggested_prompts = [{ title = "能做什麼？", message = "你能幫我做什麼？" }]
# [channels.team.modals.feedback]     # 按鈕 data = "modal:feedback" 開啟；送出後以訊息回報各欄位
# title = { type = "plain_text", text = "Feedback" }
# blocks = [{ type = "input", block_id = "b", label = { type = "plain_text", text = "Comment" }, element = { type = "plain_text_input", action_id = "c" } }]

[channels.line]
kind = "line"
listen = "127.0.0.1:8790"
channel_secret = "{{secret:LINE_SECRET}}"
channel_access_token = "{{secret:LINE_TOKEN}}"
allow = ["*"]
dm_policy = "open"
privacy_notice = "本帳號由 AI 自動回覆。"

[channels.hook]
kind = "webhook"
listen = "127.0.0.1:8787"
token = "{{secret:HOOK_TOKEN}}"
outbound_url = "https://example.com/seagent"
allow = ["*"]

# ───────────── App Server（Web／桌面／手機／API／裝置／A2A）─────────────
[app]
enabled = true
listen = "127.0.0.1:8640"
token = "{{secret:APP_TOKEN}}"       # seagent app token 會教你產生
nodes = true                         # 接受 seagent node 裝置
workspace = "/home/me/work"          # API 建立的對話用的工作目錄
# discovery = ""                     # "mdns" | "off"；空白＝LAN 模式時自動開（廣播 _seagent._tcp.local）

# 區域網路互聯（docs/cross-platform.md）：手機、平板、其他電腦在同一個 LAN 上配對使用。
# listen 用 "[::]:8640"（精靈寫的值：一個雙堆疊 socket，IPv4 與 IPv6 裝置都能連；LAN 模式下 "0.0.0.0:8640"
# 也會改綁成它），或某個私有網段位址（只綁那個）；不需要 allow_public。開啟後：
#  - mDNS 廣播 A＋AAAA（_seagent._tcp.local，所有介面）；
#  - 只接受私有網段的連線（IPv4 經雙堆疊進來時依 ::ffff: 內含的 IPv4 判斷；全球 IPv6 位址拒絕）；
#  - 自動 TLS（第一次啟動產生 <data>/tls/lan-cert.pem，指紋＝主機身分，`seagent tls show|rotate`）；
#  - 只接受私有網段（10/8、172.16/12、192.168/16、169.254/16、100.64/10、fc00::/7、fe80::/10）的連線；
#  - 網路上的連線只認已配對裝置的 token（`seagent pair code` → 掃 QR 或輸入 8 碼並在這裡核准）；
#  - 本機仍可用 http://127.0.0.1:8640 與 app token。
# [app.exposure]
# lan = true
# rate_limit_per_min = 1200

[app.a2a]
enabled = true
name = "my-seagent"
peers = { helper = "{{secret:A2A_HELPER_TOKEN}}" }
agents = { research = { url = "https://research.example.com/a2a/v1", token = "{{secret:RESEARCH_TOKEN}}" } }

# ───────────── Hooks（與 Claude Code 相容）─────────────
[[hooks]]
event = "pre_tool"
matcher = "shell"
command = "~/.config/seagent/hooks/check-shell.sh"

# 首次使用需同意：新的 [[hooks]] 指令要先 `seagent hooks approve`（或 --accept-hooks / 互動確認）才會執行。
# [hooks_extra]
# auto_accept = false
# bundled = ["command-logger", "session-memory"]   # boot-md, bootstrap-extra-files, compaction-notifier
# [hooks_extra.session_reset]
# mode = "idle"          # none | daily | idle
# idle_minutes = 240
# [[hooks_extra.outbound]]
# url = "https://hooks.example.com/seagent"
# events = ["pre_tool", "session_end"]
# secret = "{{secret:HOOK_SECRET}}"

# ───────────── 高可用、worker 擴充、集中管理台（docs/ARCHITECTURE.md §7）─────────────
# 多個 seagentd 指向同一個資料目錄（NFS／共用磁碟），以租約選主；只有 leader 跑排程、通道與 session。
# [ha]
# enabled = true
# node_id = "seagentd-a"            # 預設主機名稱
# lease_secs = 10               # leader 沉默這麼久，standby 才接手
# renew_secs = 0                # 0 = lease_secs / 3
# dir = ""                      # 租約目錄，預設 <data>/ha
# advertise = "https://seagentd-a.corp:8640"   # standby 把客戶端導向 leader 時顯示的位址
# index_dir = "/var/lib/seagent-local/index"   # SQLite 索引放節點本機（不要放 NFS）
#
# [workers]
# count = 4                     # leader 維持的 `seagent worker` 程序數；0 = session 在 daemon 內跑
# dispatch = "all"              # all：所有 session 交給 worker；explicit：只有 `seagent workers dispatch`
# command = []                  # 預設本執行檔；可改 ["ssh", "host2", "seagent", "worker", "--internal-worker-ipc"]
# restart_backoff_ms = 500
#
# [cluster]
# enabled = true                # 沒開 [ha] 也寫入節點註冊（管理台看得到）
# name = ""                     # 沒開 [ha] 時的節點名稱
# console_url = "https://console.corp:8640"         # 從管理台拉取已簽章的受管政策
# console_token = "{{secret:SEAGENT_CONSOLE_TOKEN}}"    # 唯讀 token 即可
# pull_secs = 300
# heartbeat_secs = 5
# 公鑰釘在 /etc/seagent/managed.toml：[managed] cluster_key = "ed25519:…"（seagent cluster keygen 產生）

# ───────────── 專業角色工具（資料／IT 支援／軟體開發），細節見 docs/professional-tools.md ─────────────
# 憑證一律走保險庫 `seagent secrets set NAME`；模型只指名「來源」，看不到連線字串。
# [integrations.data]
# max_rows = 1000                      # 每次查詢最多列數（上限 10000）
# [integrations.data.sources.warehouse]
# kind = "postgres"                    # postgres | mysql | mariadb | sqlite | clickhouse | bigquery
# dsn = "{{secret:WAREHOUSE_DSN}}"     # postgres://user:password@host:5432/db?sslmode=require
# description = "orders and customers (read replica)"
# [integrations.directory.providers.corp]
# kind = "ad"                          # ldap | ad | entra | okta（只讀查詢，沒有任何異動操作）
# uri = "ldaps://dc1.corp.example:636"
# base_dn = "DC=corp,DC=example"
# bind_dn = "CN=svc-seagent,OU=Service,DC=corp,DC=example"
# bind_password = "{{secret:LDAP_BIND_PW}}"
# [integrations.forge.hosts.gitlab]
# kind = "gitlab"                      # github | gitlab（自架填 api_base；寫入一律第 2 級核准）
# api_base = "https://gitlab.example.com/api/v4"
# token = "{{secret:GITLAB_TOKEN}}"
