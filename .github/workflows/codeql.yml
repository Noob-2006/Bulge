# Static analysis (GitHub code scanning). Free for public repositories; results appear under
# Security → Code scanning. Rust is analysed without a build (build-mode: none).
name: codeql
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  schedule: [{ cron: "23 4 * * 1" }]
permissions: { contents: read }
jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions: { contents: read, security-events: write, actions: read }
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
