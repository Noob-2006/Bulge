name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      # rustls + ring only: no OpenSSL, so zig cross-compiles every target. glibc floor 2.28.
      - run: cargo install --locked cargo-zigbuild
      - run: |
          t='${{ matrix.target }}'
          case "$t" in *-gnu) zt="$t.2.28" ;; *) zt="$t" ;; esac
          cargo zigbuild --release --locked --target "$zt" --bin ark
          tar -C "target/$t/release" -czf "ark-$t.tar.gz" ark
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ark-${{ matrix.target }}
          path: ark-*.tar.gz
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          merge-multiple: true
      - run: sha256sum ark-*.tar.gz > SHA256SUMS
      # SLSA build provenance; verify with: gh attestation verify ark-*.tar.gz -R <owner>/ark
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ark-*.tar.gz
      - run: gh release create "$GITHUB_REF_NAME" ark-*.tar.gz SHA256SUMS --verify-tag --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
