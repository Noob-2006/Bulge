name: release
# Tag push v* builds four Linux binaries, checks them, smoke-tests them on real old/other distros,
# bundles share/ (skills, roles, catalogs, VM builder), and publishes tarballs + SHA256SUMS +
# SBOM (+ Ed25519 signature when the signing secret is set) + build attestation.
# Asset names are the contract `ark update` and install.sh rely on:
#   ark-<triple>.tar.gz   (bin/ark, share/ark/…), SHA256SUMS, SHA256SUMS.sig, sbom.spdx.json
# Packages (ent-006/007/027/028/029): ark_<ver>-1_<arch>.deb, ark-<ver>-1.<arch>.rpm (nfpm, from the
# musl binary), ark-apt-repo.tar.gz / ark-yum-repo.tar.gz (signed with ARK_REPO_GPG_KEY), and
# ark-offline-<ver>-<arch>.tar.gz (air-gapped bundle). All except the offline bundle are inside SHA256SUMS.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  # Same inputs, same bytes: no build path or clock leaks into the binary (packaging/release/repro-check.sh).
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build/ark --remap-path-prefix=/home/runner/.cargo=/cargo"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
      # rustls + ring only: no OpenSSL, so zig cross-compiles every target. glibc floor 2.28.
      - run: cargo install --locked cargo-zigbuild
      - name: build
        run: |
          set -euo pipefail
          t='${{ matrix.target }}'
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          case "$t" in *-gnu) zt="$t.2.28" ;; *) zt="$t" ;; esac
          cargo zigbuild --release --locked --target "$zt" --bin ark
          # The microVM guest agent is x86_64 and must be static: ship it with the x86_64 musl bundle.
          agent=""
          if [ "$t" = x86_64-unknown-linux-musl ]; then
            cargo zigbuild --release --locked --target "$t" -p ark-vm --bin ark-vm-guest
            agent="--vm-agent target/$t/release/ark-vm-guest"
          fi
          # ent-004: musl is really static, gnu really stays within glibc 2.28.
          packaging/release/check-binary.sh "$t" "target/$t/release/ark" --max-glibc 2.28
          packaging/release/make-tarball.sh "$t" "target/$t/release/ark" "ark-$t.tar.gz" $agent
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ark-${{ matrix.target }}
          path: ark-*.tar.gz
  # The binaries must actually start where we claim they do: glibc 2.28 (AlmaLinux 8), Alpine
  # (musl), and native arm64 hardware (Graviton-class). Also runs install.sh from the artifacts.
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, image: "almalinux:8" }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, image: "alpine:3.20" }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, image: "almalinux:8" }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, image: "alpine:3.20" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ark-${{ matrix.target }}
          path: dist
      - name: version and share/ inside ${{ matrix.image }}
        run: |
          set -euo pipefail
          t='${{ matrix.target }}'
          mkdir -p "x/$t" && tar -xzf "dist/ark-$t.tar.gz" -C "x/$t"
          docker run --rm -v "$PWD/x/$t:/ark:ro" ${{ matrix.image }} sh -c '
            set -e
            /ark/bin/ark version
            test -f /ark/share/ark/blueprints.json
            test -d /ark/share/ark/skills -a -d /ark/share/ark/roles -a -d /ark/share/ark/plugin-catalog -a -d /ark/share/ark/optional-mcps
            # bundled share/ is found next to the binary, no env var
            env -u ARK_SHARE_DIR ARK_HOME=/tmp/h /ark/bin/ark skills list >/dev/null'
      - name: install.sh inside ${{ matrix.image }} (musl artifact only)
        if: endsWith(matrix.target, '-musl')
        run: |
          set -euo pipefail
          t='${{ matrix.target }}'
          (cd dist && sha256sum "ark-$t.tar.gz" > SHA256SUMS)
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/dist:/rel:ro" -e ARK_RELEASE_BASE=file:///rel ${{ matrix.image }} sh -c '
            set -e
            sh /src/packaging/install.sh
            ~/.local/bin/ark version
            test -d ~/.local/lib/ark/share/skills'
  # ent-006/007: .deb and .rpm from the static musl binary (one nfpm definition, packaging/nfpm).
  packages:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, triple: x86_64-unknown-linux-musl }
          - { arch: arm64, triple: aarch64-unknown-linux-musl }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ark-${{ matrix.triple }}
          path: dist-in
      - name: build .deb and .rpm
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          mkdir -p x out && tar -xzf "dist-in/ark-${{ matrix.triple }}.tar.gz" -C x
          packaging/nfpm/build-packages.sh --bin x/bin/ark --arch '${{ matrix.arch }}' --out out
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pkg-${{ matrix.arch }}
          path: out/*
  # ent-009..017: install the packages on real distributions, run `ark --version`, `ark doctor`,
  # `ark setup --non-interactive` and one offline conversation against tests/e2e/fake_provider.py.
  # Best-effort rows (CentOS 7, openSUSE Leap) are reported but cannot block a release.
  distro-matrix:
    needs: [build, packages]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: { name: pkg-amd64, path: dist }
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: { name: ark-x86_64-unknown-linux-musl, path: dist }
      - name: matrix
        run: python3 -I packaging/matrix/matrix.py --dist dist --out matrix.md --json matrix.json
      - name: signed apt + yum repositories install and verify (ent-027/028)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends gnupg dpkg >/dev/null
          packaging/repo/test-repos.sh dist
      - if: always()
        run: cat matrix.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with: { name: distro-matrix, path: "matrix.*" }
  # ent-027/028: signed repositories. Without ARK_REPO_GPG_KEY (an ASCII-armoured secret key without
  # passphrase, in a repository secret) the repositories are not built and the release says so.
  repos:
    needs: packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with: { pattern: "pkg-*", path: pkgs, merge-multiple: true }
      - name: build repositories
        env:
          REPO_KEY: ${{ secrets.ARK_REPO_GPG_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${REPO_KEY:-}" ]; then
            echo "::warning::ARK_REPO_GPG_KEY is not set: the apt/yum repositories are NOT built for this release"
            mkdir -p out; exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$REPO_KEY" | gpg --batch --import
          KID="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          mkdir -p debs rpms out repo
          cp pkgs/*.deb debs/; cp pkgs/*.rpm rpms/
          packaging/repo/make-apt-repo.py --debs debs --out repo/apt --key-id "$KID"
          packaging/repo/make-yum-repo.sh --rpms rpms --out repo/rpm --key-id "$KID" --base-url "${{ vars.ARK_REPO_BASE_URL || 'https://packages.example.com/ark' }}/rpm" --container
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" -czf out/ark-apt-repo.tar.gz -C repo apt
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$SOURCE_DATE_EPOCH" -czf out/ark-yum-repo.tar.gz -C repo rpm
          gpg --batch --armor --export "$KID" > out/ark-repo-signing-key.asc
          rm -rf "$GNUPGHOME"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with: { name: repos, path: out/*, if-no-files-found: ignore }
  repro:
    # The same tree built from two different paths must give identical bytes (A18).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: packaging/release/repro-check.sh
  publish:
    needs: [build, smoke, repro, packages, distro-matrix, repos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          pattern: "{ark-*,pkg-*,repos}"
          merge-multiple: true
      - name: SBOM, checksums, signature
        env:
          SIGNING_KEY: ${{ secrets.ARK_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          cd dist
          python3 ../packaging/release/sbom.py --root .. --out sbom.spdx.json
          python3 ../packaging/release/sbom.py --root .. --check --out sbom.spdx.json
          if [ -n "${SIGNING_KEY:-}" ]; then
            umask 077
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
            openssl pkey -in "$RUNNER_TEMP/release-key.pem" -pubout -out release-key.pub.pem
          else
            echo "::warning::ARK_RELEASE_SIGNING_KEY is not set: this release is NOT signed (SHA256SUMS + attestation only)"
          fi
          LC_ALL=C sha256sum $(ls | grep -v '^SHA256SUMS' ) | sort -k2 > SHA256SUMS
          if [ -f "$RUNNER_TEMP/release-key.pem" ]; then
            ../packaging/release/sign.sh SHA256SUMS "$RUNNER_TEMP/release-key.pem"
            rm -f "$RUNNER_TEMP/release-key.pem"
            ../packaging/release/verify-release.sh . --key release-key.pub.pem
          fi
          ls -l
      # ent-029: the air-gapped bundle wraps the verified release directory (it carries its own
      # SHA256SUMS + signature); built after signing, shipped next to it.
      - name: offline bundles
        env:
          SIGNING_KEY: ${{ secrets.ARK_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"; export SOURCE_DATE_EPOCH
          ver="${GITHUB_REF_NAME#v}"; mkdir -p offline
          keyarg=()
          if [ -n "${SIGNING_KEY:-}" ]; then umask 077; printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/k.pem"; keyarg=(--key "$RUNNER_TEMP/k.pem"); fi
          for arch in x86_64 aarch64; do
            packaging/offline/make-offline-bundle.sh --dist dist --arch "$arch" --out "offline/ark-offline-$ver-$arch.tar.gz" "${keyarg[@]}"
          done
          rm -f "$RUNNER_TEMP/k.pem"
          (cd offline && sha256sum ark-offline-* > ark-offline.SHA256SUMS)
      # SLSA build provenance; verify with: gh attestation verify ark-*.tar.gz -R <owner>/ark
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/ark-*.tar.gz
            dist/*.deb
            dist/*.rpm
            offline/ark-offline-*.tar.gz
      - run: gh release create "$GITHUB_REF_NAME" dist/* offline/* --verify-tag --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
